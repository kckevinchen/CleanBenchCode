# Web-grounded verification prompt.
#
# Used by src.verifier.verify.Verifier. One agent call per gate-eligible
# cluster. The agent has the Microsoft Foundry **Web Search** tool
# attached and is responsible for issuing its own Bing queries; we do
# NOT pre-fetch snippets.
#
# The verifier supports four cluster shapes (selected automatically by
# src.verifier.gate.cluster_shape, materialised through the {pattern}
# placeholder below):
#
#   * single_cell   - one row, one suspect column. Classic typo /
#                     casing / pattern correction.
#   * multi_row     - the same column flagged across N rows that the
#                     detector thinks may be duplicate records of one
#                     real-world entity (e.g. row_duplication).
#   * multi_column  - one row with N columns under review whose values
#                     are suspected to be mutually inconsistent
#                     (e.g. fd_violation: license -> name -> address).
#   * composite     - N rows + N columns: a duplicate-group with
#                     attribute disagreements.
#
# The verifier composes a pattern-specific TASK block in code and
# slots it into ``{task_block}`` below; the YAML stays a single
# template that handles every pattern. The agent must respond with
# strictly valid JSON; the verdict is one of {confirmed_error,
# false_positive, ambiguous}. Cited URLs MUST come from the Web
# Search tool's results - the verifier rejects any citation URL
# that wasn't surfaced as a ``url_citation`` annotation by the
# agent runtime.
#
# Placeholders (Python str.format, single braces for placeholders,
# double braces escape literal braces in the JSON example):
#   source            - CSV file basename
#   pattern           - "single_cell" | "multi_row" |
#                       "multi_column" | "composite"
#   column            - primary suspect column (single_cell) or
#                       first cluster column otherwise
#   columns           - all columns under review (or "(none)")
#   row               - primary row index, or "n/a"
#   rows              - all affected rows joined with ", " (or "n/a")
#   n_records         - number of records in the RECORDS UNDER REVIEW
#                       block (1 for single_cell / multi_column,
#                       >=2 for multi_row / composite)
#   entity_kind       - "org" | "address" | "phone" | "url" |
#                       "person" | "other"
#   suspect_value     - the cell value the LLM flagged (single_cell)
#                       or "(see RECORDS UNDER REVIEW)" otherwise
#   suggested_fix     - detector's suggested correction, or "(none)"
#   error_types       - comma-separated detector error_type keys
#   sibling_values    - bullet list of distinct non-empty values from
#                       the suspect column (single_cell only; empty
#                       block for the other patterns)
#   records_block     - "RECORDS UNDER REVIEW" body. One bullet block
#                       per record; columns under review are marked
#                       with " *" so the agent knows which fields
#                       the detector suspects.
#   task_block        - pattern-specific task instructions composed
#                       in src.verifier.verify._format_task_block.

system: >
  You are a careful data-quality reviewer. Your job is to decide
  whether one or more cell values flagged as a possible error really
  are wrong - and, when the detector flags multiple records or
  multiple columns at once, whether they are mutually consistent
  with authoritative web evidence. You have a Web Search tool
  available; use it to gather evidence whenever you need to confirm
  a claim. You may call the tool multiple times. Never invent facts
  and never cite a URL you did not actually retrieve. Quote evidence
  verbatim from the pages the tool returns. If the evidence is
  insufficient or contradictory, say so by returning
  verdict="ambiguous" - do NOT guess. You MUST always reply with one
  strictly valid JSON object matching the OUTPUT FORMAT below, with
  no markdown fences and no prose outside the JSON payload. This is
  non-negotiable: even if you decide not to call the Web Search tool
  (e.g. the value looks like a private individual's name with no
  authoritative public source, the request seems out of scope, or
  any other reason), you MUST STILL respond with a JSON object whose
  ``verdict`` is "ambiguous" and whose ``reasoning`` field briefly
  states why no web check was attempted. Returning an empty message
  or refusing to answer is a protocol violation.

user_template: |
  CONTEXT
  -------
  source:        {source}
  pattern:       {pattern}
  primary row:   {row}
  rows:          {rows}
  primary col:   {column}
  columns:       {columns}
  entity_kind:   {entity_kind}
  error_types:   {error_types}
  suspect_value: {suspect_value}
  suggested_fix: {suggested_fix}

  RECORDS UNDER REVIEW ({n_records} record(s); columns marked with
  " *" are flagged by the detector and are the focus of this check.
  Use the unmarked columns as cross-reference context only):
  {records_block}

  OTHER VALUES IN THIS COLUMN (single_cell only, up to 8 distinct
  samples for context; empty for multi-row / multi-column):
  {sibling_values}

  TASK
  ----
  {task_block}

  EVIDENCE QUALITY GATE
  ---------------------
  * For "confirmed_error" you MUST cite at least one URL whose page
    text contains a near-verbatim occurrence of the canonical value
    (or, for multi-row / composite patterns, of the canonical entity
    name). The ``evidence`` array MUST therefore be NON-EMPTY when
    verdict is "confirmed_error".
  * "Near-verbatim" means the cited snippet contains the canonical
    value as a contiguous substring, allowing ONLY:
      - case differences ("New York" matches "new york"),
      - whitespace normalisation ("New  York" matches "New York"),
      - ASCII-punctuation differences ("U.S.A." matches "USA"),
      - Unicode NFKC normalisation (full-width / smart quotes /
        curly apostrophes).
    The following do NOT count as near-verbatim and are NEVER
    acceptable as evidence:
      - abbreviation expansion ("FBI" does not match
        "Federal Bureau of Investigation"),
      - synonym substitution ("Big Apple" does not match "New York"),
      - paraphrase or summarisation,
      - partial-prefix matches ("New" alone does not match "New York").
    If the only way to bridge the snippet and the canonical value is
    one of the disallowed transforms, the snippet is NOT evidence.
  * Cite the URL exactly as the Web Search tool returned it; do not
    invent or paraphrase URLs. The verifier rejects any citation
    whose URL the runtime did not record as a Web Search source.
  * Confidence calibration:
      Verdict = "confirmed_error" (your certainty the suspect is wrong):
        0.9 - 1.0  multiple independent authoritative sources agree
        0.7 - 0.89 one authoritative source clearly supports the claim
        0.4 - 0.69 partial / circumstantial support
        0.0 - 0.39 weak; you should usually return "ambiguous" instead
      Verdict = "false_positive" (your certainty the suspect is correct):
        same scale; ``evidence`` may be empty if no positive
        confirmation exists, but ``reasoning`` must explain why no
        contradicting evidence was found.
      Verdict = "ambiguous":
        confidence MUST be in [0.0, 0.49]. If you are more confident
        than that, pick "confirmed_error" or "false_positive" instead.

  OUTPUT FORMAT
  -------------
  Respond with one JSON object exactly matching this shape:

  {{
    "verdict": "confirmed_error | false_positive | ambiguous",
    "canonical_value": "<string, or null>",
    "canonical_record": {{
      "<column_name>": "<corrected_value>"
    }},                                  // OPTIONAL. Populate only for
                                         // multi_column / composite
                                         // patterns where you are
                                         // correcting >=1 specific
                                         // columns. For single_cell /
                                         // multi_row, omit this field
                                         // (or set to null). Keys MUST
                                         // be column names that
                                         // appeared in RECORDS UNDER
                                         // REVIEW.
    "confidence": 0.0,
    "evidence": [
      {{
        "url": "<exact URL surfaced by Web Search>",
        "title": "<page title>",
        "quote": "<<=200 char near-verbatim snippet from that page>"
      }}
    ],                                  // MUST contain >=1 entry when verdict is "confirmed_error"; may be [] for "false_positive" / "ambiguous"
    "reasoning": "<one to three sentences justifying the verdict>"
  }}
