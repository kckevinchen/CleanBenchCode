# Relation-discovery prompt: per multi-column error type, ask the LLM to
# enumerate every relation / dependency / constraint that should hold
# over the table, given a compact whole-table digest plus a small row
# sample.
#
# This is "Phase D" - it runs once per (source, error_type) BEFORE the
# per-row detection phase. Discovered relations are persisted to
# relations.jsonl and later fed back into per-type detection prompts
# as a "RELATIONS TO CHECK" block, so detection no longer has to
# re-discover the rules from scratch on every row chunk.
#
# Output is strictly JSON - the loader in src.core.relations parses
# `{"relations": [...]}` and canonicalizes each entry into a stable
# species key for Good-Turing accounting in the adaptive driver.
#
# Placeholders consumed by base.user_template:
#   type_key, type_name, type_category, type_description,
#   type_example, type_notes - the per-type metadata copied from
#       prompts/error_types.yaml so each call is reminded of
#       exactly what defect class it is enumerating relations for.
#   table_overview      - compact TABLE OVERVIEW block built by
#       src.core.table_digest. Headers, dtypes, top values,
#       identity-column candidates, approximate FDs, total-row hints.
#   row_sample          - a small Markdown table of stratified rows
#       (first / median / last by row index) so the LLM can ground
#       inferred rules in concrete values without seeing the whole CSV.
#   error_type_kinds    - allowed values for the relation `kind`
#       field for this error type (a small closed vocabulary).

base:
  system: >
    You are a senior data-quality auditor. Your job is to ENUMERATE
    every INTER-COLUMN relation that should hold over a tabular
    dataset for one specific error type at a time. You only
    enumerate the rules; downstream detectors find the violations.

    Each rule you emit is independently tested by a code validator
    against the FULL table, which reports a pass-rate. Rules where
    most rows violate are filtered out automatically; you do not
    need to ensure that yourself. Silence is the only irreversible
    mistake -- when in doubt, EMIT the rule with
    ``confidence: "low"``.

    THE ONLY CRITERION: NO PER-VALUE RULES

    Emit any inter-column rule you think might hold. The validator
    will compute the real pass-rate on the FULL table and the
    filter gate drops anything where most rows violate or no rows
    violate, so your job is HIGH RECALL: propose every rule the
    headers, dtypes, and digest suggest could plausibly be true.
    Even speculative rules belong here -- mark them
    ``confidence: "low"`` and let the validator decide.

    The ONE exception: do not emit rules tied to ONE specific cell
    value (or a handful of values) of a high-cardinality column.
    Those are per-row facts, not schema-level constraints, and the
    same predicate would need to be repeated for every other
    value of the column.

    Examples to SKIP:
      * ``if Customer == 'Acme Corp' then Country == 'US'`` --
        Customer has many distinct values; this is one row's fact.
      * ``if Description == 'Exemption 10 MW' then Capacity <=
        10000`` -- one branch of a free-text column.
      * ``if Airline == 'Virgin Atlantic' then FlightNumber starts
        with 'VS'`` -- one airline out of many; the IATA-code fact
        is real but does not generalize at the column level.
      * ``if Status == 'CodeXYZ987' then ...`` -- any rule whose
        LHS literal pins down one row, period.

    Rule of thumb: if the LHS column has more than 4 distinct
    values, a rule keyed on one of those values is a row, not a
    constraint -- omit it. If a family of such per-row literals
    fits a parametric pattern (e.g. ``Capacity <= 1000 *
    parse_int(regex_extract(Description, 'Exemption (\\d+) MW'))``),
    emit the parametric form instead -- ONE rule covers the whole
    family and the validator evaluates it row-by-row.

    Conditional rules over a small enum LHS are fine:
      * ``if Status == 'Approved' then Approver is non-null``
        (Status is a 3-value enum: Approved/Rejected/Pending).
      * ``if Country in {'US','CA','MX'} then Region == 'NA'``
        (Country has a small enum here).
    Those generalize at the column level; emit them.

    HARD RULES

    * INTER-COLUMN ONLY. Every rule involves two or more columns on
      the SAME row (or, for FDs, columns evaluated on rows sharing
      a determinant value). No cross-row aggregation rules over a
      single column ("sum of Sales matches the total row",
      "max(Price) <= cap", "count of Status='Open' rows matches
      OpenCount", "average Salary == AvgSalary"); those belong to
      a separate aggregation pass. Per-row sums across columns
      (``Subtotal + Tax == Total``) are fine -- they operate on
      one row.
    * NO HALLUCINATED COLUMNS. Every column referenced must appear
      verbatim in the COLUMN HEADERS list. Do not invent columns
      or fold spelling variants.
    * BE COMPACT. One rule per logical dependency; do not emit
      paraphrase duplicates of the same constraint; do not emit
      trivially-true rules.
    * PREFER INEQUALITIES OVER STRICT EQUALITIES.  When a pair (or
      set) of columns satisfies BOTH an inequality form
      (``ordered`` / ``chronological`` / ``monotone`` / ``bounded``)
      AND a strict arithmetic equality (``difference`` / ``sum`` /
      ``ratio`` / ``percentage``) in the sample rows, emit ONLY the
      inequality.  Concrete examples of the trap to avoid:
        * Two date columns where the sample rows all show a 12-day
          gap between them.  The actual constraint is just
          chronological ordering ("Career deadline must be on or
          before Pay Period Begin"); the exact 12-day offset is
          incidental and varies on full data.  Emit ONE
          ``chronological`` rule; DO NOT emit "Career = Begin - 12
          days" as a ``difference`` rule.
        * Two numeric columns where Cost is exactly 80% of Revenue
          in every sample row.  Unless headers explicitly name a
          fixed markup, the actual rule is ``Cost <= Revenue``,
          not ``Cost == 0.8 * Revenue``.
      The strict offset/ratio should only appear when it is
      STRUCTURAL: a header literally names it (``Days30Offset``,
      ``BiWeeklyDays``, ``TaxRate``, ``Markup%``), the error type
      definition requires it, or the offset is a well-known
      domain convention (``Subtotal + Tax == Total``).

    Respond with strictly valid JSON -- no prose outside the JSON
    payload and no Markdown code fences.

  user_template: |
    You are enumerating relations for a SINGLE error type over the
    table(s) described below. Stay strictly inside this type's lane;
    relations for sibling types are handled by separate calls.

    ERROR TYPE:    {type_name}
    TAXONOMY TAG:  {type_category}
    TYPE KEY:      {type_key}

    DEFINITION
    {type_description}

    REFERENCE EXAMPLES (for guidance only)
    {type_example}

    APPLICABILITY NOTES
    {type_notes}

    {table_overview}

    SAMPLE ROWS (a small stratified preview - the first column
    `__row__` is the 0-indexed source row number; this is NOT the
    whole table, only enough to ground inferred rules in concrete
    values):

    {row_sample}

    {priors_section}

    ALLOWED `kind` VALUES FOR THIS ERROR TYPE
    {error_type_kinds}

    TASK
    ----
    Enumerate every relation that SHOULD hold over the full table
    and whose violation would belong to the "{type_name}" error
    type. For each relation:

    * Pick a `kind` from the allowed list above.
    * List the involved `columns` (verbatim from the headers).
    * Write a short natural-language `predicate` describing the
      rule (e.g. "Zip determines State", "TotalPrice == UnitPrice
      * Quantity", "StartDate <= EndDate", "EmpID is unique").
    * For directional dependencies (FDs), set `lhs` to the
      determinant column(s) and `rhs` to the dependent column(s).
      Leave both null for symmetric relations.
    * For executable relations (per-row calculations, ordered
      comparisons, equalities between columns of the same row)
      you MUST also fill the `executable` field with a concise
      expression using ONLY column names from the headers and the
      operators {{+, -, *, /, ==, !=, <=, >=, <, >, in()}}. The
      expression is evaluated INDEPENDENTLY on each row, so every
      operand must be a column reference or a literal - never a
      cross-row aggregate. Examples:
        - "TotalPrice == UnitPrice * Quantity"
        - "StartDate <= EndDate"
        - "Subsidy == 0.5 + (Loss - 0.3) * (0.2/0.7)"
        - "Subtotal + Tax == Total"
      Leave `executable` null ONLY when the rule is genuinely
      non-arithmetic and non-comparable (free-text business
      rules, factual world-knowledge rules like
      Country->Capital). If you wrote an arithmetic or
      comparison rule in the `predicate`, the same rule MUST
      also appear in `executable`. NEVER write an executable
      that aggregates across rows (no ``sum(Col)``, ``avg(Col)``,
      ``count(Col)``, ``max(Col)``, ``min(Col)``, or any
      ``Col[range]`` indexing).
    * `confidence` is "high" when the rule is essentially
      definitional (Zip determines State; LineTotal == UnitPrice
      * Quantity), "medium" when clearly suggested by headers,
      "low" when speculative but plausible. Emit low-confidence
      rules -- the validator runs them against the full table
      and rejects the ones that don't hold. Skipping a
      low-confidence rule means we never check it.
    * `rationale` is at most 1 sentence stating WHY the rule
      should hold (header semantics, dtype, domain convention,
      digest hint, etc.).

    PARAMETRIC ABSTRACTION (for free-text columns with repeated
    patterns)
    -------------------------------------------------------------
    When a pattern repeats across many literal values of a column
    (e.g. "Exemption 1 MW", "Exemption 5 MW", "Exemption 10 MW"),
    do NOT emit one rule per literal value. Emit ONE parametric
    rule whose `executable` extracts the parameter using these
    pseudo-functions:
      - regex_extract(col, "<regex with one capture group>")
      - parse_int(...) / parse_float(...)
      - lower(col), upper(col), trim(col)
    Example: instead of N rules of the form ``Description ==
    'Exemption K MW' => Capacity <= K * 1000``, emit:
      kind:       implication
      columns:    ["Description", "Authorized Capacity (kW)"]
      predicate:  "Authorized Capacity (kW) <= 1000 * the integer
                   K parsed from Description 'Exemption (\\d+) MW'"
      executable: "Authorized Capacity (kW) <= 1000 *
                   parse_int(regex_extract(Description,
                   'Exemption (\\d+) MW'))"
    If no parametric form fits, OMIT the family rather than
    enumerating literal-keyed branches.

    DO NOT
    * Reference a column not in the headers list above.
    * Emit paraphrase duplicates of the same constraint.
    * Emit single-column rules (typo, casing, format) -- those
      belong to single-column detectors.
    * Emit cross-row aggregation rules (sum / count / avg / max /
      min over rows of a single column).
    * Emit rules keyed on one literal value of a high-cardinality
      column (per-row facts; see "THE SINGLE CRITERION: COVERAGE"
      in the system prompt).

    OUTPUT FORMAT
    -------------
    Respond with a single JSON object, no markdown fences:

    {{
      "relations": [
        {{
          "kind":       "<one of the allowed kinds>",
          "columns":    ["<col>", ...],
          "lhs":        ["<col>", ...]   | null,
          "rhs":        ["<col>", ...]   | null,
          "predicate":  "<short natural-language rule>",
          "executable": "<expression>"   | null,
          "confidence": "high"|"medium"|"low",
          "rationale":  "<1 sentence>",
          "tables":     ["<sheet.csv>", ...] | null,
          "column_refs":[["<sheet.csv>","<col>"], ...] | null
        }}
      ]
    }}

    The `tables` and `column_refs` fields are ONLY required when the
    relation crosses two or more sheets in a workbook (a multi-table
    error type, see workbook context below). For single-sheet
    relations leave both fields null or omitted; the runner sets
    them automatically.

    If no relations apply, return exactly: {{"relations": []}}

# Per-error-type entries. Only multi-column / multi-row / multi-table
# types live here - single-column types do not have inter-column
# relations to discover.
#
# `kinds` is the closed vocabulary substituted into the prompt's
# ALLOWED `kind` block. Keep them short and orthogonal so the LLM
# can pick deterministically.
types:

  fd_violation:
    scope: row
    kinds:
      - fd                 # A determines B (with A and B sets of columns)
      - composite_fd       # (A1, A2, ...) determines B

  row_calculation_inconsistency:
    scope: row
    # POLICY: PREFER INEQUALITIES OVER STRICT EQUALITIES WHEN BOTH
    # HOLD.  Many tables exhibit an exact arithmetic offset between
    # two columns in the sample rows (e.g. "Career Deadline" is 12
    # days before "Pay Period Begin" in every visible row), but the
    # actual business rule is just ORDERING - the offset is
    # incidental and varies across the full table.  When in doubt,
    # emit the inequality form (``ordered`` / ``chronological`` /
    # ``monotone`` / ``bounded``) and DO NOT also emit the strict
    # ``sum`` / ``product`` / ``difference`` / ``ratio`` /
    # ``percentage`` over the same column set unless the offset /
    # ratio is named or strongly implied by the headers (e.g. a
    # column literally named "Days30Offset", "BiWeeklyCount",
    # "TaxRate", "Markup%").  Emitting both forms creates redundant
    # over-specific rules that flag rows the inequality already
    # accepts.
    kinds:
      - sum                # c == a + b (+ ...).  See POLICY: do not
                           # emit a sum rule between dates - prefer
                           # ``chronological``.
      - product            # c == a * b.  See POLICY: do not emit
                           # for date columns.
      - difference         # c == a - b.  ONLY emit when the offset
                           # is STRUCTURAL (named in a header,
                           # implied by domain convention like a
                           # bi-weekly pay period that columns name
                           # explicitly, or fixed by the error type
                           # definition).  DO NOT emit "X is N days
                           # before Y" rules between date columns
                           # where the actual constraint is just
                           # ordering: emit ``chronological`` instead.
                           # When both an order rule and a fixed
                           # offset would apply, emit ONLY the order.
      - ratio              # c == a / b.  See POLICY.
      - percentage         # c == 100 * a / b   (or a / b == c%).  See POLICY.
      - ordered            # a <= b (or <, >=, >) between two numeric
                           # columns (MinPrice <= MaxPrice; Lower <=
                           # Upper; Cost <= Revenue; YearStarted <=
                           # YearCompleted). For DATE/TIME columns
                           # specifically, prefer ``chronological``.
      - chronological      # date-sequence ordering between two or
                           # more date / datetime columns on the
                           # same row (StartDate <= EndDate;
                           # CreatedAt <= UpdatedAt <= ClosedAt;
                           # OrderDate <= ShipDate <= DeliveryDate;
                           # IssueDate <= ExpirationDate). Use this
                           # when ALL involved columns are
                           # dates/datetimes; use ``ordered`` for
                           # non-date scalars.  PREFER THIS over
                           # ``difference`` when both would apply
                           # (the day-count offset is almost always
                           # incidental, not a constraint).
      - bounded            # low <= x <= high: value column lies
                           # within a range defined by two other
                           # columns (BudgetMin <= Actual <= BudgetMax;
                           # MinAge <= Age <= MaxAge)
      - monotone           # v1 <= v2 <= v3 <= ... across a sequence
                           # of same-row columns (Q1Cum <= Q2Cum <=
                           # Q3Cum <= Q4Cum; sorted period totals)

  string_calculation_inconsistency:
    scope: row
    kinds:
      - concatenation      # c == a + sep + b   (e.g. FullName == First + " " + Last)
      - composition        # c is a deterministic combination of components
                           # (Address from Street/City/Zip; Email from User+Domain)
      - equality           # a == b after normalisation (case/whitespace)
      - prefix             # b.startswith(a)  (a is a prefix of b; or "leading
                           # digits of Code equal Region")
      - suffix             # b.endswith(a)    (a is a suffix of b; or "trailing
                           # year-tag of SKU equals YearCode")
      - substring          # b.contains(a)    (a appears verbatim somewhere
                           # inside b; weaker than prefix/suffix)
      - partial_match      # a fixed-position slice of one column equals
                           # another column (e.g. positions [3:6] of SKU
                           # equal the CategoryCode column)
      - length_order       # len(a) <= len(b) (or <, >=, >): a recurring
                           # length ordering between two string columns
                           # (Abbreviation <= FullName; ShortCode <=
                           # LongCode; ISO2 <= ISO3)
      - inequality         # a != b after normalisation (two string
                           # columns that should never agree on the same
                           # row -- e.g. SourceLanguage != TargetLanguage,
                           # PrimaryEmail != BackupEmail)

  row_duplication:
    scope: group
    kinds:
      - identity            # tuple of columns that uniquely identifies a row;
                            # exact duplicates on this tuple flag row_duplication

  # Multi-table type only runs when the discovery driver detects two
  # or more sibling sheets in the same workbook (xlsx parent dir).
  # On single-sheet workbooks this arm is skipped entirely.
  inter_table_inconsistency:
    scope: table
    kinds:
      - foreign_key         # a column in CHILD references a controlled
                            # value set carried by a column in PARENT;
                            # values in CHILD outside that set are orphans
      - attribute_agreement # rows in two sheets sharing an identity key
                            # must agree on listed descriptive columns
      - synonym             # two sheets use different headers for what is
                            # clearly the same concept (high value-overlap)
      - homonym             # two sheets share a header that means
                            # different things (disjoint value sets)
      - unit                # same column carries values in different units
      - scale               # same column carries values at different scales
      - encoding            # same concept encoded differently (M/F vs 0/1)
