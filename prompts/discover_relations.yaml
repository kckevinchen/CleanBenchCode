# Relation-discovery prompt: per multi-column error type, ask the LLM to
# enumerate every relation / dependency / constraint that should hold
# over the table, given a compact whole-table digest plus a small row
# sample.
#
# This is "Phase D" - it runs once per (source, error_type) BEFORE the
# per-row detection phase. Discovered relations are persisted to
# relations.jsonl and later fed back into per-type detection prompts
# as a "RELATIONS TO CHECK" block, so detection no longer has to
# re-discover the rules from scratch on every row chunk.
#
# Output is strictly JSON - the loader in src.core.relations parses
# `{"relations": [...]}` and canonicalizes each entry into a stable
# species key for Good-Turing accounting in the adaptive driver.
#
# Placeholders consumed by base.user_template:
#   type_key, type_name, type_category, type_description,
#   type_example, type_notes - the per-type metadata copied from
#       prompts/error_types.yaml so each call is reminded of
#       exactly what defect class it is enumerating relations for.
#   table_overview      - compact TABLE OVERVIEW block built by
#       src.core.table_digest. Headers, dtypes, top values,
#       identity-column candidates, approximate FDs, total-row hints.
#   row_sample          - a small Markdown table of stratified rows
#       (first / median / last by row index) so the LLM can ground
#       inferred rules in concrete values without seeing the whole CSV.
#   error_type_kinds    - allowed values for the relation `kind`
#       field for this error type (a small closed vocabulary).

base:
  system: >
    You are a senior data-quality auditor. Your job is to ENUMERATE
    every relation, dependency, or constraint that SHOULD hold over a
    tabular dataset for ONE specific error type at a time. You are
    NOT scanning rows for violations - downstream detectors do that.
    You only enumerate the rules.

    PRECISION OVER RECALL. A spurious relation pollutes the
    downstream detector and produces false positives. Only emit a
    relation when the headers, dtypes, sampled values, or the
    explicit hints in the digest make the rule clearly inferable. If
    in doubt, omit. Returning an empty list is a valid answer.

    SEMANTIC GROUNDING IS REQUIRED. Every relation must rest on a
    real-world reason - a definition, an arithmetic identity, a
    domain convention, a regulatory rule, or an entity model -
    NOT just a pattern that happens to hold on the sampled rows.

    Before emitting a relation, ask: "If this rule were violated
    on a NEW row not in the sample, would the violation still be
    a defect?" If the answer depends on the specific rows shown,
    do NOT emit the rule.

    Examples of patterns that LOOK like rules but are usually NOT
    semantic:
      * Coincidental orderings between independent columns. A
        column of "Q4 2020 subsidy %" being <= a column of "Q1
        2021 subsidy %" on every sampled row does NOT imply they
        are causally ordered - subsidy rates across quarters are
        independent policy decisions, not monotonic by nature.
      * Coincidental equalities between unrelated value sets. Two
        columns sharing the same handful of values in the sample
        does not imply they must always agree.
      * Coincidental rankings. A "score" column happening to
        descend with row order does not imply the table is
        sorted by score.
      * Coincidental ranges. A numeric column staying within
        [0, 100] in the sample does not mean it is bounded by
        [0, 100] - the constraint must be definitional (a
        percentage, a probability) or stated by domain convention.

    Emit a relation ONLY when at least one of the following is
    true:
      (a) ARITHMETIC IDENTITY - one column is a closed-form
          function of others (Total = sum of details, Tax =
          Subtotal * rate, EndDate >= StartDate by definition).
      (b) ENTITY MODEL - the column set obviously encodes the
          same entity (an ID column determines a Name column;
          Zip determines State).
      (c) DEFINITIONAL CONSTRAINT - dtype + header semantics
          force the bound (a percentage column lies in [0,100],
          a count column is non-negative).
      (d) DOMAIN CONVENTION - a widely-known business or regulatory
          rule that competent humans would recognize from the
          column names alone (postal-code/state mapping, ISO
          country codes, accounting equation).
      (e) EXPLICIT DIGEST HINT - the digest already flagged the
          relation (candidate FD, identity-like column,
          aggregation pair, total-row index). Treat these as
          stronger evidence than sample patterns.

    If the only reason to emit a rule is "the sampled rows obey
    it", DO NOT EMIT IT. The sample is small and stratified; you
    will see spurious patterns by chance.

    NO HALLUCINATIONS. Every column referenced in a relation MUST
    appear verbatim in the COLUMN HEADERS list. Never invent column
    names. Never reference a column that is not in the digest.

    BE COMPACT. One relation per logical rule. Do not duplicate the
    same dependency in different phrasings. Do not include trivial
    or universally-true relations.

    Respond with strictly valid JSON - no prose outside the JSON
    payload and no Markdown code fences.

  user_template: |
    You are enumerating relations for a SINGLE error type over the
    table(s) described below. Stay strictly inside this type's lane;
    relations for sibling types are handled by separate calls.

    ERROR TYPE:    {type_name}
    TAXONOMY TAG:  {type_category}
    TYPE KEY:      {type_key}

    DEFINITION
    {type_description}

    REFERENCE EXAMPLES (for guidance only)
    {type_example}

    APPLICABILITY NOTES
    {type_notes}

    {table_overview}

    SAMPLE ROWS (a small stratified preview - the first column
    `__row__` is the 0-indexed source row number; this is NOT the
    whole table, only enough to ground inferred rules in concrete
    values):

    {row_sample}

    {priors_section}

    ALLOWED `kind` VALUES FOR THIS ERROR TYPE
    {error_type_kinds}

    TASK
    ----
    Enumerate every relation that SHOULD hold over the full table
    and whose violation would belong to the "{type_name}" error
    type. For each relation:

    * Pick a `kind` from the allowed list above.
    * List the involved `columns` (verbatim from the headers).
    * Write a short natural-language `predicate` describing the
      rule (e.g. "Zip determines State", "TotalPrice == UnitPrice
      * Quantity", "StartDate <= EndDate", "EmpID is unique").
    * For directional dependencies (FDs), set `lhs` to the
      determinant column(s) and `rhs` to the dependent column(s).
      Leave both null for symmetric relations.
    * For executable relations (calculations, aggregations,
      ordered comparisons, equalities) you MUST also fill the
      `executable` field with a concise expression using ONLY
      column names from the headers and the operators
      {{+, -, *, /, ==, !=, <=, >=, <, >, sum(), in()}}. Examples:
        - "TotalPrice == UnitPrice * Quantity"
        - "StartDate <= EndDate"
        - "Subsidy == 0.5 + (Loss - 0.3) * (0.2/0.7)"
        - "sum(Sales[detail_rows]) == Sales[total_row]"
      Leave `executable` null ONLY when the rule is genuinely
      non-arithmetic and non-comparable (free-text business
      rules, factual world-knowledge rules like
      Country->Capital). If you wrote an arithmetic or
      comparison rule in the `predicate`, the same rule MUST
      also appear in `executable`.
    * `confidence` is "high" when the rule is essentially
      definitional (Zip determines State, total = sum of details),
      "medium" when strongly suggested by headers + samples, "low"
      when speculative. Prefer omitting low-confidence rules
      altogether.
    * `rationale` is at most 1 sentence and must cite the
      specific evidence (header names, dtypes, observed value
      pattern, digest hint) that supports the rule. The
      rationale must name WHICH semantic category from the
      grounding list above the rule rests on - arithmetic
      identity, entity model, definitional constraint, domain
      convention, or explicit digest hint. A rationale that
      only describes a sample pattern ("values in the sample
      are monotonic", "all sampled rows satisfy ...") is NOT
      acceptable; omit the rule instead.

    DO NOT
    * Emit a relation that references a column not in the
      headers list above.
    * Emit two relations whose predicates are paraphrases of each
      other.
    * Emit single-column rules (typo, casing, format) - those
      belong to single-column detectors.
    * Speculate beyond what the headers + samples + digest hints
      support.
    * Emit a relation whose only justification is that the
      sampled rows happen to satisfy it. Coincidental orderings,
      equalities, rankings, or ranges across independent columns
      are NOT semantic rules. The constraint must rest on
      arithmetic identity, entity model, definitional dtype,
      domain convention, or an explicit digest hint - not on
      what the small sample looks like.
    * Enumerate one rule per literal cell value of a free-text or
      high-cardinality column. Specifically, do NOT emit a
      separate relation for every observed value of a column,
      such as
        - "If Description == 'Exemption 10 MW' then Capacity <= 10000",
        - "If Description == 'Exemption 5 MW'  then Capacity <= 5000",
        - "If Description == 'Exemption 1 MW'  then Capacity <= 1000".
      These are unverifiable at the schema level and explode the
      rule set with paraphrases. Instead, prefer ONE PARAMETRIC
      RULE that captures the family - see "PARAMETRIC ABSTRACTION"
      below. Value-keyed rules are ONLY acceptable when the
      conditioning column has a tiny closed enum (<=4 distinct
      values in the digest) AND each branch carries a genuinely
      different non-numeric constraint.

    HARD RED-LINE FOR `implication` / `mandatory_when` /
    `equality_within` / `factual` / `bounded` / `cap` / `equality`:
    Before emitting a rule whose predicate or executable contains
    a quoted literal that is also a cell value of one of the
    referenced columns (i.e. a literal pulled from the column's
    `top values` in the digest), CHECK the column's
    `n_distinct`. If the column has more than 4 distinct values
    in the digest, DO NOT EMIT THE RULE. The rule is
    sample-fitted to one specific cell - the same predicate
    would have to be repeated for every other value of that
    column, none of which the schema can validate. Examples
    that MUST be rejected at this gate:
        * "if Customer Name == 'Acme Corp' then Country == 'US'"
          (Customer Name is high-cardinality - this is one row,
          not a rule)
        * "if Product == 'Widget' then UnitPrice == 9.99"
          (Product is high-cardinality - per-row literal)
        * "if Notes == 'Approved by Manager' then Status ==
          'Approved'" (Notes is free-text - never a rule
          source)
    Examples that PASS this gate:
        * "if Status == 'Approved' then Approver is non-null"
          (Status has a tiny enum: Approved/Rejected/Pending)
        * "Country == 'France' implies Capital == 'Paris'" only
          when both columns are short closed enums of country
          codes / capitals.

    DOMAIN CONVENTION DOES NOT BYPASS THE CARDINALITY CAP.
    A real-world fact (IATA airline codes, country capitals,
    ZIP -> state, brand -> ticker, customer -> tax ID,
    product -> SKU prefix) becomes a SCHEMA RULE only when the
    LHS column is itself a short closed enum (n_distinct <= 4
    in the digest). The set of true facts in the world is NOT
    the same as the set of schema-level constraints over your
    table. Even when the underlying fact is real, encoding a
    per-entity mapping in the rule set explodes into N siblings
    and the schema still cannot validate any of them. Examples
    that LOOK like domain convention but are actually per-row
    literals and MUST be rejected:
        * "if Airline == 'Virgin Atlantic' then FlightNumber
          starts with 'VS'" - Airline column has many distinct
          values; this is one row's fact, not a constraint. The
          IATA code 'VS' is real, but the rule still fails the
          cardinality cap.
        * "if Airline == 'Delta' then FlightNumber starts with
          'DL'" - same pattern, same rejection.
        * "if Brand == 'Apple' then Ticker == 'AAPL'" - one row.
        * "if Customer == 'Acme Corp' then Tax ID == '12-3456'"
          - one row.
        * "if Country == 'United States' then Capital ==
          'Washington, D.C.'" when Country has > 4 distinct
          values in the digest - one row per country.
    The unit of generalization for a schema-level rule is the
    COLUMN, not the individual entity. If a domain convention
    only holds entity-by-entity (per airline, per brand, per
    customer), the rule belongs in a lookup table or a
    parametric form (see PARAMETRIC ABSTRACTION) - NOT in the
    relation set. Rule of thumb: if the LHS column has more
    than 4 distinct values, the rule is a row, not a
    constraint - omit it.

    PARAMETRIC ABSTRACTION
    * When a rule pattern repeats across many literal values of
      a free-text column, emit a single rule whose `predicate`
      describes the pattern parametrically and whose `executable`
      uses pseudo-functions to extract the parameter from the
      cell. Allowed pseudo-functions in `executable`:
        - regex_extract(col, "<regex with one capture group>")
        - parse_int(...) / parse_float(...)
        - lower(col), upper(col), trim(col)
      Example: instead of N rules of the form "Description ==
      'Exemption K MW' => Capacity <= K * 1000", emit ONE rule:
        kind:       implication
        columns:    ["Description", "Authorized Capacity (kW)"]
        predicate:  "Authorized Capacity (kW) <= 1000 * the
                     integer K parsed from Description matching
                     'Exemption (\\d+) MW'"
        executable: "Authorized Capacity (kW) <= 1000 *
                     parse_int(regex_extract(Description,
                     'Exemption (\\d+) MW'))"
      If no parametric form fits, omit the family rather than
      enumerating literal-keyed branches.

    OUTPUT FORMAT
    -------------
    Respond with a single JSON object, no markdown fences:

    {{
      "relations": [
        {{
          "kind":       "<one of the allowed kinds>",
          "columns":    ["<col>", ...],
          "lhs":        ["<col>", ...]   | null,
          "rhs":        ["<col>", ...]   | null,
          "predicate":  "<short natural-language rule>",
          "executable": "<expression>"   | null,
          "confidence": "high"|"medium"|"low",
          "rationale":  "<1 sentence>",
          "tables":     ["<sheet.csv>", ...] | null,
          "column_refs":[["<sheet.csv>","<col>"], ...] | null
        }}
      ]
    }}

    The `tables` and `column_refs` fields are ONLY required when the
    relation crosses two or more sheets in a workbook (a multi-table
    error type, see workbook context below). For single-sheet
    relations leave both fields null or omitted; the runner sets
    them automatically.

    If no relations apply, return exactly: {{"relations": []}}

# Per-error-type entries. Only multi-column / multi-row / multi-table
# types live here - single-column types do not have inter-column
# relations to discover.
#
# `kinds` is the closed vocabulary substituted into the prompt's
# ALLOWED `kind` block. Keep them short and orthogonal so the LLM
# can pick deterministically.
types:

  fd_violation:
    scope: row
    kinds:
      - fd                 # A determines B (with A and B sets of columns)
      - composite_fd       # (A1, A2, ...) determines B

  row_calculation_inconsistency:
    scope: row
    kinds:
      - sum                # c == a + b (+ ...)
      - product            # c == a * b
      - difference         # c == a - b
      - ratio              # c == a / b
      - percentage         # c == 100 * a / b   (or a / b == c%)

  string_calculation_inconsistency:
    scope: row
    kinds:
      - concatenation      # c == a + sep + b   (e.g. FullName == First + " " + Last)
      - composition        # c is a deterministic combination of components
                           # (Address from Street/City/Zip; Email from User+Domain)
      - equality           # a == b after normalisation (case/whitespace)

  row_duplication:
    scope: group
    kinds:
      - identity            # tuple of columns that uniquely identifies a row;
                            # exact duplicates on this tuple flag row_duplication

  # Multi-table type only runs when the discovery driver detects two
  # or more sibling sheets in the same workbook (xlsx parent dir).
  # On single-sheet workbooks this arm is skipped entirely.
  inter_table_inconsistency:
    scope: table
    kinds:
      - foreign_key         # a column in CHILD references a controlled
                            # value set carried by a column in PARENT;
                            # values in CHILD outside that set are orphans
      - attribute_agreement # rows in two sheets sharing an identity key
                            # must agree on listed descriptive columns
      - synonym             # two sheets use different headers for what is
                            # clearly the same concept (high value-overlap)
      - homonym             # two sheets share a header that means
                            # different things (disjoint value sets)
      - unit                # same column carries values in different units
      - scale               # same column carries values at different scales
      - encoding            # same concept encoded differently (M/F vs 0/1)
