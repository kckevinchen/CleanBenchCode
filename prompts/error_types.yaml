# Per-error-type detection prompts - SIMPLE / INCLUSIVE 9-TYPE TAXONOMY.
#
# A pared-down counterpart to prompts/error_types_focused.yaml. Same
# nine error-type keys, same JSON output schema, same template
# placeholders (so the loader in src/core/error_taxonomy.py and every
# downstream consumer continue to work unchanged) - but with far
# fewer fast-skip / down-weight / carve-out rules. The intent is to
# let the model FLAG anything that plausibly matches each type's
# definition rather than gate-keep on named-entity columns, identity
# columns, truncation, dominant-share thresholds, peer counts, etc.
#
# If you want the heavily-gated version (R1-R9, semantic-view
# regimes, named-entity carve-outs, numeric thresholds, truncation
# guard, ...), set prompts.error_types_file in config/experiment.yaml
# to prompts/error_types_focused.yaml.
#
# Keys (pick a subset via prompts.error_types in config/experiment.yaml
# or --error-types on the CLI):
#
#   ---- Single-Column ----
#   typo                              - isolated spelling mistake
#   inconsistency                     - representational variation across rows
#                                       of the same column (text / casing /
#                                       pattern / punctuation / number_format)
#   semantic_incompatible             - value out of the column's domain
#   numeric_outlier                   - extreme value inside a numeric column
#
#   ---- Multi-Column (intra-row) ----
#   fd_violation                      - functional dependency broken
#   row_calculation_inconsistency     - within-row numeric formula fails
#   string_calculation_inconsistency  - within-row string composition fails
#
#   ---- Multi-Row (intra-table) ----
#   row_duplication                   - duplicate / near-duplicate rows
#
#   ---- Multi-Table (cross-source) ----
#   inter_table_inconsistency         - same entity disagrees across sources
#
# column_mode requirements (unchanged from the focused version):
#   * Single-Column types work with column_mode='single'.
#   * fd_violation, row_calculation_inconsistency,
#     string_calculation_inconsistency, row_duplication require
#     column_mode='all'.
#   * inter_table_inconsistency is rarely visible inside a single
#     slice; most calls will return no findings.

base:
  system: >
    You are a data-quality auditor. Each call targets ONE specific
    error type; other types are handled by separate calls.

    FAVOR RECALL. A downstream human + web-grounded verifier can
    reject false positives, but a missed defect is gone forever.
    When a cell plausibly matches the error type's definition,
    FLAG it. Use ``confidence: "low"`` (a first-class verdict)
    instead of staying silent when evidence is partial.

    Confidence: ``high`` = unambiguous; ``medium`` = clear evidence
    with one piece of uncertainty; ``low`` = borderline / sparse
    evidence. When undecided between two adjacent levels, pick the
    lower one.

    Empty cells (NULL, NaN, ``""``, whitespace-only) are not
    defects by themselves. Ignore them when counting peers and
    never list them in ``affected_rows``.

    Respond with strictly valid JSON. No prose outside the JSON.
    No Markdown fences.

  user_template: |
    Audit the slice below for ONE data-quality error type. Stay
    focused on that type; defects belonging to other types are
    caught by their own dedicated calls.

    ERROR TYPE:    {type_name}
    TAXONOMY TAG:  {type_category}

    DEFINITION
    {type_description}

    REFERENCE EXAMPLES (for guidance; may or may not appear in the data)
    {type_example}

    NOTES
    {type_notes}

    {table_overview}

    COLUMN HEADERS (the complete set of columns you may reference;
    the slice may contain a single column or many, depending on the
    run):
    {headers}

    ROWS (Markdown table; the first column `__row__` is the 0-indexed
    source row number from the CSV, covering rows [{start_row}, {end_row})):

    {rows}

    WHITESPACE MARKERS in the rows table (sentinels for characters
    a markdown table would otherwise hide). Treat each marker as
    the original character:
      * "␣" = SPACE (regular or non-breaking).
      * "→" = TAB.
      * "↵" = NEWLINE inside a cell.
      * "·" = zero-width char (ZWSP, ZWNJ, ZWJ, soft hyphen, BOM).
    Internal multi-space runs are NOT replaced.

    TASK
    ----
    Find every defect in the slice that matches "{type_name}" as
    defined above. A finding may be:
      * per-cell (one row, one or more columns),
      * group-level (multiple rows of the same column - typical for
        representation / formatting inconsistencies), or
      * multi-column per-row (typical for cross-column contradictions).

    For group-level findings, emit ONE issue per group: set ``row``
    to the smallest affected row number, set ``columns`` to the
    affected column(s), and list ALL affected row numbers in
    ``affected_rows`` (do NOT truncate; ``affected_rows_total`` must
    equal its length).

    Rules
    -----
    1. Default to flagging; return ``{{"issues": []}}`` only when
       you see no candidate. Partial evidence -> ``confidence:
       "low"``.
    2. Stay in your lane. Defects that clearly belong to a SIBLING
       type are caught by that sibling's own call; skip them here.
       When borderline between this type and a sibling, flag here
       at low confidence rather than dropping the finding.
    3. ``columns`` lists the involved column(s); use ``[]`` only
       for pure row-level findings (e.g. row_duplication).

    OUTPUT FORMAT
    -------------
    Respond with a single JSON object, no markdown fences:

    {{
      "issues": [
        {{
          "row": <int>,                          // smallest affected row
          "columns": [<string>, ...],            // [] for pure row-level
          "affected_rows": [<int>, ...],         // optional; group-level only
          "affected_rows_total": <int>,          // == len(affected_rows)
          "observed": "<short verbatim snippet(s) of the problematic value(s)>",
          "explanation": "<1-2 sentence justification>",
          "suggested_fix": "<concrete recommendation; null if unclear>",
          "corrected_value": {{<column>: "<literal canonical replacement value>", ...}} | null,
          "confidence": "high" | "medium" | "low"
        }}
      ]
    }}

    CORRECTED_VALUE RULES
    ---------------------
    `corrected_value` is the LITERAL canonical replacement string the
    downstream system can write directly into each affected cell -
    NOT a sentence, NOT an instruction. It complements
    `suggested_fix` (human-readable guidance).

    * Provide an object keyed by every column in `columns`; the value
      is the literal canonical string for that column (e.g.
      `"Acme, Inc."`, `"United States"`, `"2011-01-01"`, `"0.15"`).
    * For group-level findings (multiple `affected_rows`), the SAME
      canonical value is applied to every affected row's cell in
      that column. If different affected rows need DIFFERENT
      canonical values, split the finding into one issue per
      canonical value.
    * For multi-column per-row findings, list one entry per column.
    * Use `null` when no single literal value would be defensible
      (e.g. value should simply be deleted, or only the user knows
      the right answer). Do NOT put prose like "Capitalize the
      suffix to Inc." in `corrected_value` - that belongs in
      `suggested_fix`.
    * Pure row-level findings (`columns: []`) MUST set
      `corrected_value` to `null`.
    * Quote characters in literal values exactly as they should
      appear in the cell - no surrounding quotes, no markdown, no
      whitespace markers (`␣`, `→`, `↵`, `·`).

    If nothing applies, return exactly: {{"issues": []}}

types:

  # =====================================================================
  # SINGLE-COLUMN
  # =====================================================================

  typo:
    name: "Typo"
    category: "Single-Column / Typo"
    description: >
      A per-cell defect in a TEXT value, decidable from the cell +
      column header alone. Four flavours:
        * spelling    - 1-2 char distortion or obvious misspelling
                        of a clearly-intended word.
        * whitespace  - REPEATED INTERNAL spaces, or embedded tab /
                        newline. (Leading/trailing whitespace has
                        already been stripped during CSV
                        preprocessing - ignore any pure leading or
                        trailing "␣" marker.)
        * punctuation - stray, missing, or unbalanced punctuation
                        inside the cell.
        * casing      - wrong-case fragment inside an otherwise
                        standard word (e.g. "28TH" -> "28th").

      Favour recall: if a cell looks like a likely typo, FLAG it -
      use ``confidence: "low"`` when the intended form is uncertain.
    example: |
      FLAG
      * "Misisipi", "Unietd States", "recieve", "Divison"  (spelling)
      * "James   Smith"                                    (whitespace)
      * "James Smith- Microsoft", "James Smith (microsoft" (punctuation)
      * "28TH"                                             (casing)

      DO NOT FLAG
      * Recognised abbreviations / acronyms / state or country
        codes ("USA", "U.S.", "IA", "NY", "Inc", "Ltd", "Ave",
        "St", "Dr", "Mt", "MoE", "FRCS"). Short !=  typo.
      * Abbreviations used consistently across the column (e.g.
        every row in `Town Name` ends in "Plt" / "Twp" / "CSD"):
        that is the column's convention, not a misspelling.
      * " James Smith" / "James Smith " - leading/trailing spaces
        are pre-stripped; not a typo.
      * "1/11/1919" in a `date_of_birth` column - not decidable
        from cell + header alone.
      * Opaque / fixed-length codes (zip, FIPS, SKU, employee id,
        ISBN, UUID, version, serial). A character difference is a
        different code, not a misspelling.
      * Cross-row casing / punctuation variation -> `inconsistency`.
      * Wrong-domain value (phone in a Name column) ->
        `semantic_incompatible`.
    notes: |
      Per-cell finding. `explanation` MUST start with the flavour
      label so downstream metrics can split recall by sub-type and
      optionally drop the trivial flavours (many baselines do not
      predict whitespace / punctuation / casing typos):
        * "typo:spelling - ..."
        * "typo:whitespace - ..."
        * "typo:punctuation - ..."
        * "typo:casing - ..."

      ABBREVIATIONS ARE NOT TYPOS. Standard abbreviations,
      acronyms, initialisms, state/country codes ("USA", "U.S.",
      "IA", "Inc", "Ltd", "Ave", "St", "Dr", "Mt", "MoE", "FRCS")
      are legitimate short spellings - DO NOT FLAG. Also DO NOT
      FLAG an abbreviation that is used consistently across the
      column's other rows (e.g. "Plt" in every Town Name); that
      is the column's house style. Short-and-long coexistence
      in the same column goes to `inconsistency` (text
      sub-pattern), not typo.

      EXCEPTION: the cell-only typo test. Look at the short value
      ALONE (ignore the column). Does it read as a clean
      abbreviation - initialism ("USA"), all-caps acronym ("CSD"),
      first-syllable / consonant truncation ("Plt", "Twp", "Ave"),
      or recognised shorthand? If yes, NOT a typo. If instead the
      short value looks like a botched word (transposed letters,
      doubled letters, a missing internal letter, a typed-near-by
      key swap - e.g. "Recieve", "Plnt" where "Plt"/"Plant" is the
      intended form, "Aev" instead of "Ave"), FLAG as typo even
      though it is short.

  inconsistency:
    name: "Inconsistency"
    category: "Single-Column / Inconsistency"
    description: >
      A MINORITY of rows in a single column deviate from the dominant
      representational convention used by the column's other rows.
      The values denote the same KIND of thing; the defect is that
      peers spell, capitalise, structure, punctuate, or numerically
      encode the same concept differently. Five sub-patterns:

        * text          - distinct textual variants of the SAME entity
                          (abbreviations, alternative names, word-order
                          differences). Example: "USA" vs "United States".
        * casing        - identical letters, different capitalisation.
                          Example: "james smith" vs "James Smith" vs
                          "JAMES SMITH".
        * pattern       - structured / semi-structured values whose
                          syntactic SHAPE differs (token kind or order),
                          not merely letter count. Example:
                          "800-123-4567" vs "(800) 123-4567" vs
                          "8001234567"; "01/01/2011" vs "2011-01-01".
        * punctuation   - same shape, different punctuation marks
                          (hyphen vs en dash, smart vs straight quotes,
                          period vs none) or incidental
                          leading/trailing whitespace.
        * number_format - mixed numeric ENCODINGS for the same
                          magnitude (% vs decimal, commas vs none,
                          currency symbol attached vs not,
                          parentheses vs leading minus, scientific
                          vs fixed-point).

      Every finding MUST name its sub-pattern in `explanation`
      (e.g. "inconsistency:text - 'USA' vs 'United States'") so
      downstream metrics can split recall by sub-type.
    example: |
      text:           "USA" / "U.S.A." / "United States" in one Country column.
      casing:         "james" / "James" / "JAMES".
      pattern:        "800-123-4567" / "(800) 123-4567" / "8001234567";
                      "01/01/2011" / "2011-01-01".
      punctuation:    "123-456" / "123–456" (en dash); " james " vs "james".
      number_format:  "15%" mixed with "0.15"; "$1,000" mixed with "1000";
                      "(50)" mixed with "-50".

      DO NOT FLAG
      * Different REAL-WORLD ENTITIES that happen to differ in token
        count or spacing ("Buena Vista" alongside "Adams" in a
        County column - those are different counties, not pattern
        variants).
      * One-character spelling distortions ("Smtih" vs "Smith") ->
        `typo`.
      * Pure content variation between unrelated values.
    notes: |
      WHAT TO FLAG
      * For each sub-pattern axis where a minority deviates from
        the dominant convention, emit ONE group-level finding
        listing ONLY the minority rows in `affected_rows`. The
        `explanation` MUST start with the sub-pattern label
        (`inconsistency:text|casing|pattern|punctuation|number_format`);
        `suggested_fix` rewrites the minority to the dominant form.
      * One finding per axis - if a row deviates on multiple axes,
        emit one finding per axis so the breakdown stays clean.
      * Confidence: higher when the dominant share is clearly
        large; lower when no clear convention exists (still emit
        at "low").

      SUB-PATTERN TESTS (apply the right test for the right axis)
      * text: case-folded + punctuation-normalised forms differ but
        denote the same entity.
      * casing: values are IDENTICAL after case-folding; raw casing
        differs.
      * pattern: tokenise into character classes (digits D, letters
        A, separators); shapes differ in TOKEN KIND or ORDER, not
        merely length. On named-entity columns (county, city,
        organisation, ...), space / token-count differences reflect
        the entities' real-world spellings - do not flag those as
        pattern findings.
      * punctuation: identical after Unicode-normalising punctuation
        and stripping leading/trailing whitespace; raw forms differ.
      * number_format: forms denote the SAME numeric value when
        normalised (15% == 0.15; 10,000 == 10000). If they don't,
        it's not number_format.

      WHAT NOT TO FLAG (siblings cover them)
      * Spelling mistakes (1-2 char distortion of a known word) ->
        `typo`.
      * Out-of-domain values -> `semantic_incompatible`.
      * Extreme numeric magnitudes -> `numeric_outlier`.
      * Cross-column FD conflicts -> `fd_violation`.
      * Cross-source unit / encoding mismatches ->
        `inter_table_inconsistency`.

  semantic_incompatible:
    name: "Semantic Incompatible"
    category: "Single-Column / Semantic"
    description: >
      A cell whose semantic TYPE or DOMAIN does not match the column
      it sits in. The value is recognisable as something - a phone
      number, a date, a name - but it belongs in a different column.
      Detection is per-cell against the inferred semantic identity
      of the column.
    example: |
      * A phone number sitting in a Name column.
      * A name sitting in a Salary column.
      * A free-text narrative sitting in an integer-count column.
      * A status of "Pending review" in a column whose observed
        domain is {Open, Closed}.
    notes: |
      Infer the column's intended domain from its header AND its
      non-empty peer values. The PEERS WIN when they establish a
      coherent convention that disagrees with a naive reading of
      the header (e.g. header "year" but every value is "act20",
      "FY24"; header "percentage" but every value is "1/3", "2/5";
      header "amount" but every value is stored in cents). A cell
      that matches the column's convention is NOT a domain
      violation, even if a strict reading of the header alone would
      say otherwise. Only flag a cell that DEPARTS from the
      convention the rest of the column established.

      WHAT TO FLAG
      * Per-cell finding: `row` = offending row,
        `columns` = [<column>], `observed` = the value verbatim,
        `explanation` names the column's inferred domain and what
        the value actually is. When the domain is established by
        peer convention rather than header, the explanation MUST
        cite the convention.
      * Confidence: ``high`` for unambiguous type mismatches (phone
        in a Name column); ``medium`` when the column's domain is
        less certain; ``low`` for free-text-like columns or
        mixed-type columns where a cell merely looks unusual.

      WHAT NOT TO FLAG (siblings cover them)
      * A coercible format issue (number written with commas in a
        numeric column) -> `inconsistency` (number_format).
      * An out-of-distribution numeric value inside a numeric column
        -> `numeric_outlier`.
      * Spelling mistakes -> `typo`.
      * Cross-column factual conflicts -> `fd_violation`.

  numeric_outlier:
    name: "Numeric Outlier"
    category: "Single-Column / Distribution"
    description: >
      Inside a NUMERIC column, a value sits far from the bulk of the
      column's distribution AND looks like a data-entry mistake
      (typo, wrong unit, stray digit) rather than a legitimately
      large observation in a naturally heavy-tailed quantity.

      Be deliberate: most extreme-looking numbers in real data
      (death counts, sales spikes, populations, revenues) are real.
      Flag implausible values at high confidence and large-gap but
      plausible values at low confidence so the reviewer can
      sanity-check them.
    example: |
      DO flag:
      * Salary $1,000,000 when peers cluster $50k-$120k and nothing
        about the row explains it.
      * Quantity 10,000 in a column otherwise containing 1-50.
      * Year "20200" when other rows are 2000-2024 (extra digit).
      * Age 250 in a person-level table.

      DO NOT flag (numerically extreme but semantically plausible):
      * 15 deaths in an incidence column where most rows are 0-1
        (heavy-tailed; outbreaks happen).
      * $5M order in a revenue column - large customers exist.
      * Population 8M for a capital city among 5k-50k towns.
    notes: |
      Only applies when the column reports a QUANTITY (count,
      amount, percentage, currency, magnitude, duration, age).
      Numeric-LOOKING columns whose digits encode something else -
      zip / FIPS / SKU / phone / version / year / ID columns - are
      out of scope; do not flag those.

      Exclude TOTAL / SUMMARY rows before comparing (labels
      matching /total|sum|grand[- ]?total|subtotal|average|avg|mean/
      case-insensitive). Aggregates are designed to be larger than
      detail rows.

      WHAT TO FLAG
      * Per-cell finding citing the peer summary plus a brief
        plausibility note. E.g. "median ~75k, IQR ~30k; this row is
        10M, far above peers, and the role 'Junior Analyst' makes
        10M implausible."
      * For multiple outliers in the same column, emit a single
        group-level finding listing every outlier row in
        ``affected_rows`` (never truncate).
      * Confidence: ``high`` when the value is BOTH a large
        statistical gap AND implausible for the entity; ``medium``
        for clear gaps with some plausibility; ``low`` for
        extreme-but-plausible values in heavy-tailed columns.

      WHAT NOT TO FLAG (siblings cover them)
      * Non-numeric values in the column -> `semantic_incompatible`.
      * Format-only quirks (% vs decimal) -> `inconsistency`
        (number_format).
      * A row whose number violates an algebraic relation
        (price*qty != total) -> `row_calculation_inconsistency`.

  # =====================================================================
  # MULTI-COLUMN (intra-row)
  # =====================================================================

  fd_violation:
    name: "FD (Functional Dependency) Violation"
    category: "Multi-Column / Intra-Record"
    description: >
      A violation of a strict, known functional dependency between
      attributes: a "determinant" column's value implies a specific
      dependent value, and the dependent column disagrees. Detected
      either within a single row (using known real-world FDs) or
      across rows that share the same determinant value.

      Requires column_mode='all'.
    example: |
      * Same Zip code appears with two different States across rows.
      * Same ProductCode appears with two different Categories.
      * Same EmployeeID appears with two different Departments.
      * Country = "France" implies Capital = "Paris" (within-row FD).
    notes: |
      The DETERMINANT should be an identifier or code drawn from a
      controlled real-world vocabulary (zip, country, product code,
      employee id, ISBN). Person names are weak determinants because
      of homonyms - prefer ``confidence: "low"`` for name-keyed FD
      findings rather than skipping them outright. The DEPENDENT
      must be a deterministic function of the determinant (not
      free-text).

      WHAT TO FLAG
      * Across-row: group rows by the determinant value; flag groups
        that disagree on the dependent column.
          - `row`: smallest affected row
          - `columns`: [determinant, dependent]
          - `affected_rows`: every row in the disagreeing group
          - `observed`: e.g. "Zip=94103 -> State=CA (rows 3,4) vs
            State=NY (row 17)"
      * Within-row: only when the FD is well-known real-world
        knowledge (Zip->State, Country->Capital).
      * Confidence: ``high`` for strict known FDs violated;
        ``medium`` for candidate FDs holding across the slice
        except for a small disagreeing minority; ``low`` for soft /
        approximate dependencies (City -> Region usually).

      WHAT NOT TO FLAG (siblings cover them)
      * Numeric derivations -> `row_calculation_inconsistency`.
      * String composition rules -> `string_calculation_inconsistency`.
      * Exact duplicate rows -> `row_duplication`.
      * Within-column representation variants -> `inconsistency`.
      * Cross-source disagreements -> `inter_table_inconsistency`.

  row_calculation_inconsistency:
    name: "Number / Calculation Inconsistency"
    category: "Multi-Column / Intra-Record"
    description: >
      Within a single row, NUMERIC fields fail to satisfy an expected
      arithmetic relation across columns. Two shapes count:

        * EQUALITY: a derived column equals the algebraic combination
          of its components (sum / product / difference / ratio /
          percentage).
        * INEQUALITY / ORDER: an ordering or range relation that
          must hold between numeric columns (start <= end; min <=
          value <= max; cumulative sequences in non-decreasing
          order).

      Requires column_mode='all'.
    example: |
      Equality (derived-column) violations:
        * unit_price=10, quantity=3, total_price=35 (expected 30).
        * subtotal=90, tax=9, total=110 (expected 99).
        * start=100, end=120, delta=15 (expected 20).
        * principal=1000, rate=0.05, interest=60 (expected 50).

      Inequality / order violations:
        * MinPrice=99, MaxPrice=49 (min must be <= max).
        * BudgetMin=10, Actual=42, BudgetMax=30 (Actual outside
          [BudgetMin, BudgetMax]).
        * Q1Cum=100, Q2Cum=80 (cumulative-by-quarter must be
          non-decreasing).
        * Cost=120, Revenue=100 (when the business rule is Cost
          <= Revenue).

      Chronological-order violations (a date sequence is out of
      order across two or more date columns in the same row):
        * StartDate=2026-05-10, EndDate=2026-05-03 (start must
          be <= end).
        * CreatedAt=2026-04-01, UpdatedAt=2026-03-15 (updated
          before created).
        * OrderDate=2024-08-12, ShipDate=2024-08-10 (ship before
          order).
    notes: |
      All columns involved in the relation must be true QUANTITIES
      (or ordered scalars: dates, ages, years, sequence positions).
      Identifier / code / version / phone columns are not addable
      AND not orderable in a business sense; do not infer arithmetic
      OR ordering relations through them.

      The relation must be named or strongly implied by the headers
      (subtotal+tax=total, price*qty=total, end-start=delta,
      Start <= End, Min <= Max, Lower <= Upper). Don't manufacture
      relations between columns that merely have similar magnitudes
      or whose names sort the same way.

      WHAT TO FLAG
      * Per-row finding: `columns` = every column involved in the
        relation; `observed` = "a=10, b=3, c=35 (expected 30)" or
        "Start=2026-05-10, End=2026-05-03 (Start must be <= End)";
        `explanation` names the relation.
      * Allow a small rounding tolerance (~0.01 of the expected
        value, or any integer mismatch on integer columns) for
        EQUALITY relations. INEQUALITY relations are strict: if the
        rule is start <= end, an exact tie is fine, but start > end
        by any amount is a violation.
      * Confidence: ``high`` when the relation is explicit in the
        headers and the mismatch is well above rounding tolerance;
        ``medium`` when the relation is strongly suggested but
        ambiguous; ``low`` for speculative relations (still emit so
        the reviewer can confirm).

      WHAT NOT TO FLAG (siblings cover them)
      * String composition / partial-string -> `string_calculation_inconsistency`.
      * A single unusual number -> `numeric_outlier`.
      * Mixed number formats -> `inconsistency` (number_format).
      * Determinant/dependent disagreements -> `fd_violation`.

  string_calculation_inconsistency:
    name: "String / Calculation Inconsistency"
    category: "Multi-Column / Intra-Record"
    description: >
      Within a single row, STRING-valued fields fail to satisfy a
      cross-column rule. Three shapes count:

        * COMPOSITION / CONCATENATION: a composed string column does
          not match the deterministic combination of its components
          (FullName == First + " " + Last).
        * PARTIAL containment: one column is a deterministic
          prefix / suffix / substring / fixed-position slice of
          another (SKU starts with Brand; Email ends with "@" +
          Domain).
        * LENGTH ORDER or INEQUALITY: a length comparison must hold
          between two string columns (Abbreviation length <=
          FullName length), or two columns that should never
          coincide on the same row are equal (SourceLanguage !=
          TargetLanguage).

      Requires column_mode='all'.
    example: |
      * FirstName="Alice", LastName="Brown", FullName="Bob Smith"
        (expected "Alice Brown").
      * City="Paris", Country="France", Location="Berlin, Germany"
        (expected "Paris, France").
      * Domain="example.com", User="alice", Email="bob@example.com"
        (expected "alice@example.com").
      * Street="123 Main St", City="NY", Zip="10001",
        Address="456 Oak Ave, NY 10001" (Address does not include
        the row's Street value).
      * Partial-string relations: a column is a PREFIX / SUFFIX /
        SUBSTRING / fixed-position slice of another. Examples:
          - SKU="BR-1024" with Brand="BR" -> SKU.startswith(Brand).
          - Email="alice@example.com" with Domain="example.com" ->
            Email.endswith("@" + Domain).
          - FullPath="/data/raw/2026/file.csv" with Year="2026" ->
            FullPath.contains(Year).
          - InvoiceID="2026-Q4-0042" with Quarter="Q4" -> slice [5:7]
            of InvoiceID equals Quarter.
      * Length-order inequality:
          - ISO2="USA", ISO3="US" (len(ISO2) must be <= len(ISO3);
            the row swapped them).
          - Abbreviation="United States of America",
            FullName="USA" (Abbreviation must not be longer than
            FullName).
      * Two-column distinctness (inequality):
          - SourceLanguage="en", TargetLanguage="en" on a translation
            row (the two should never be equal).
          - PrimaryEmail="a@x.com", BackupEmail="a@x.com" (the backup
            should be different).
    notes: |
      Composition rules must be strongly implied by the composed
      column's header (FullName <- First + " " + Last; Email <-
      User + "@" + Domain; Address <- Street + ", " + City + " " +
      Zip; URL <- Scheme + "://" + Host + Path; SKU <- Brand + "-" +
      Code).

      Partial-string rules (prefix / suffix / substring / partial_match)
      apply when a column is a DETERMINISTIC fragment of another: a
      structured identifier whose pieces are spelled out as separate
      columns elsewhere in the row. Prefer the most specific kind:
      ``prefix`` when one column anchors the start of another,
      ``suffix`` when it anchors the end, ``substring`` when it is
      contained somewhere inside, ``partial_match`` when the position
      is fixed but neither at the start nor the end. Do not propose a
      partial-string rule when the relationship would only hold by
      coincidence (e.g. one column's value happens to appear in another
      because both were copy-pasted from the same source).

      Inequality rules (``length_order``, ``inequality``) apply when a
      pair of string columns must satisfy a non-equality relation on
      every row, not just when one happens to be a fragment of the
      other. Only propose them when the headers strongly suggest the
      asymmetry (Abbrev vs Full, Source vs Target, Primary vs Backup,
      ISO2 vs ISO3). Don't propose distinctness rules between
      semantically interchangeable columns where coincidental
      equality is normal.

      When none of the visible columns triggers any of these rules,
      return no findings.

      WHAT TO FLAG
      * Per-row finding: `columns` = every component plus the
        composed column; `observed` = the actual vs expected string;
        `explanation` names the rule.
      * Allow reasonable normalisation when matching (case-folding,
        whitespace collapsing, separator tolerance " " / ", " /
        " - ").
      * Confidence: ``high`` when the rule is unambiguous and the
        mismatch is clear; ``medium`` when separator / order /
        wording have genuine flexibility ("Smith, Alice" vs "Alice
        Smith"); ``low`` for speculative rules.

      WHAT NOT TO FLAG (siblings cover them)
      * Numeric derivations -> `row_calculation_inconsistency`.
      * Identifier-based FDs -> `fd_violation`.
      * Pure casing / spelling differences on a single column ->
        `inconsistency` or `typo`.

  # =====================================================================
  # MULTI-ROW (intra-table cross-row)
  # =====================================================================

  row_duplication:
    name: "Row Duplication Error"
    category: "Multi-Row / Inter-Record"
    description: >
      Two or more rows that refer to the IDENTICAL real-world entity
      with identical (or near-identical) attribute values - typically
      caused by repeated ingestion or a join gone wrong.

      Requires column_mode='all' for reliable detection.
    example: |
      * Two rows where every visible column has identical values,
        representing the same transaction recorded twice.
      * Three rows that are character-for-character identical.
    notes: |
      Use the column set to infer the table's role. Snapshot /
      master-data / inventory tables (one row per entity) treat
      exact repeats as defects at high confidence. Transaction logs
      / event streams / time series may legitimately replay values
      at different times - require an event/time column match
      before flagging at high confidence; otherwise prefer
      ``confidence: "low"``. Aggregate rows ("Total", "Subtotal")
      are not duplicates of detail rows.

      WHAT TO FLAG
      * Set of rows where every observed column has an identical
        non-empty value.
      * Group-level finding:
          - `row`: smallest row in the duplicate group
          - `columns`: [] or the full column set
          - `affected_rows`: every row in the duplicate group
          - `observed`: "<N> duplicate rows"
          - `explanation`: "row_duplication: identity=<...>"
      * Works best with column_mode='all'. With column_mode='single',
        only flag when the column clearly carries unique-identifier
        semantics and exact repeats are clearly defects.

      WHAT NOT TO FLAG
      * Near-duplicates caused only by formatting differences -
        normalise mentally first, then re-check. If still duplicates
        after normalising, flag here; otherwise route the formatting
        difference to `inconsistency`.
      * Distinct entities that merely look similar.

  # =====================================================================
  # MULTI-TABLE (cross-source)
  # =====================================================================
  #
  # The slice typically shows a single table; evidence for this type
  # mostly lives outside the slice. Findings will be rare, but DO
  # flag when the slice itself contains the disagreeing pieces (two
  # source blocks stacked in the same CSV, an FK-like value against
  # a controlled set visible in the slice, mixed units on one
  # column, ...).

  inter_table_inconsistency:
    name: "Inter-table Inconsistency"
    category: "Multi-Table / Relational"
    description: >
      Conflicting or incompatible values describing the same
      real-world entity, key, or attribute across multiple tables or
      sources. Covers (a) referential-integrity breaks (a key value
      in a child table has no match in the parent), (b) cross-source
      attribute disagreements (the same entity has different
      addresses / amounts / statuses in two tables), and (c)
      representation mismatches across sources (different units,
      scales, or encodings for the same concept; same header naming
      different concepts or different headers naming the same
      concept).
    example: |
      * A row references "Dept 127" but no Dept 127 exists in the
        parent Departments table.
      * Customer "C001" has address "1 Main St" in Customers and
        "9 Oak Ave" in Orders for the same period.
      * Sales recorded in USD in one block and EUR in another with
        no currency column.
      * Gender coded 0/1 in block A and M/F in block B for the same
        population.
      * Block A uses "CustomerID"; block B uses "ClientNumber" for
        the same join key.
    notes: |
      Flag only when the slice ITSELF carries enough evidence to
      ground the finding. Signals to look for inside a slice:
        * two or more SOURCE BLOCKS stacked (the same column shows
          clearly different value distributions across row ranges,
          or a "source"/"file" metadata column distinguishes them);
        * an FK-LIKE column whose value lies outside the controlled
          set observed elsewhere in the slice;
        * the same header naming clearly different concepts across
          blocks, or different headers naming the same concept;
        * mixed unit / scale / encoding on a column with no
          disambiguating metadata column.

      WHAT TO FLAG
      * FK orphan: per-cell finding,
        `explanation` = "inter_table_orphan: <column> value '<v>'
        not in observed set {<...>}".
      * Attribute conflict: group-level,
        `explanation` = "inter_table_attribute_conflict: <identity>
        differs on <column>".
      * Representation mismatch: group-level,
        `explanation` = "inter_table_representation:
        <unit / scale / coding>".
      * Naming mismatch: group-level,
        `explanation` = "inter_table_naming: <synonym|homonym>".
      * Confidence: ``high`` when the disagreement is fully
        materialised in the slice; ``medium`` for one-sided
        evidence; ``low`` for column-name signals you cannot fully
        verify from the slice.

      DEFAULT BEHAVIOUR
      * A homogeneous single-table slice with no FK-like column and
        no controlled vocabulary visible carries no cross-source
        signal; return ``{"issues": []}``. Do not hallucinate
        cross-table evidence.

      WHAT NOT TO FLAG (siblings cover them)
      * Within-table FD violations -> `fd_violation`.
      * Within-table duplicate rows -> `row_duplication`.
      * Single-source columns whose values use mixed encodings ->
        `inconsistency` (number_format / pattern sub-pattern).
      * Format-only differences on identifier columns ->
        `inconsistency` (pattern / casing sub-pattern).
