# Per-error-type detection prompts - FOCUSED 13-TYPE TAXONOMY.
#
# This taxonomy mirrors `error_type.csv` row-for-row: every row in the CSV
# becomes ONE error-type key here, with its own description / examples /
# notes block. The key naming follows snake_case of the CSV "Error Type"
# column.
#
# Keys (use any subset via `prompts.error_types` in config/experiment.yaml
# or `--error-types` on the CLI):
#
#   ---- Single-Column (Scope=Single-Column in the CSV) ----
#   typo                              - isolated spelling mistake
#   text_inconsistency                - same entity, different terminology
#   casing_inconsistency              - same entity, different capitalisation
#   pattern_inconsistency             - structural shape mismatch (dates, phones, codes...)
#   punctuation_inconsistency         - punctuation / whitespace differences
#   number_format_inconsistency       - mixed numeric encodings (% vs decimal, commas)
#   semantic_incompatible             - cell value out of column's semantic domain
#   numeric_outlier                   - statistical extreme inside a numeric column
#
#   ---- Multi-Column (Scope=Multi-Column in the CSV; intra-row) ----
#   fd_violation                      - known functional dependency violated
#   row_calculation_inconsistency     - within-row numeric derivation does not balance
#   string_calculation_inconsistency  - within-row string derivation/composition does not match
#
#   ---- Multi-Row (Scope=Multi-Row in the CSV; intra-table cross-row) ----
#   row_duplication                   - two+ rows are exact / near-exact duplicates
#
#   ---- Multi-Table (Scope=Multi-Table in the CSV; cross-source) ----
#   inter_table_inconsistency         - the same entity/key/attribute disagrees across tables/sources
#
# IMPORTANT - column_mode requirements:
#   * Single-Column types (typo, text_inconsistency, casing_inconsistency,
#     pattern_inconsistency, punctuation_inconsistency,
#     number_format_inconsistency, semantic_incompatible, numeric_outlier)
#     work fine with `column_mode: single`.
#   * Multi-Column intra-row types (fd_violation,
#     row_calculation_inconsistency, string_calculation_inconsistency) and
#     Multi-Row row_duplication require `column_mode: all`.
#   * inter_table_inconsistency is RARELY visible inside a single chunk.
#     The detector will mostly return empty findings; only flag when
#     evidence for cross-table / cross-source disagreement is fully visible
#     inside the slice (e.g. two source blocks stacked in the same CSV).
#     Expect a high FN rate and review by hand.
#
# File structure matches the generic loader in `src/error_taxonomy.py`:
#   defaults             - optional mapping of numeric thresholds (peer_min,
#                          dominant_pct, minority_pct,
#                          peer_min_outlier, iqr_multiple,
#                          freetext_mean_length). Substituted into the
#                          base prompts via ${name} (string.Template) at
#                          load time, so threshold edits are a single-place
#                          change. If omitted, the loader falls back to the
#                          numbers literally written in the prompts.
#   base.system          - system prompt shared by every per-type call
#   base.user_template   - user prompt template; .format() placeholders are
#                          substituted at runtime with:
#                            type_key, type_name, type_category,
#                            type_description, type_example, type_notes,
#                            headers, rows, start_row, end_row
#   types.<key>          - per-error-type data

# Single source of truth for the quantitative thresholds referenced by the
# GLOBAL RULES in base.user_template. Per-type notes still spell the
# numbers out inline for readability and so the prompt-variant rewriter
# (Rule 6: "PRESERVE QUANTITATIVE THRESHOLDS VERBATIM") sees a stable
# seed; if you change a value here, also update the matching inline
# mention in the per-type notes.
defaults:
  peer_min: 5                # R2 slice-size guard (general)
  dominant_pct: 60           # R3 dominant baseline lower bound (%)
  minority_pct: 20           # R3 minority upper bound (%)
  peer_min_outlier: 8        # numeric_outlier-specific peer minimum
  iqr_multiple: 5            # numeric_outlier IQR cutoff
  # NOTE: iqr_multiple was raised from 3 to 5 on 2026-04-30 to suppress
  # heavy-tail false positives on financial / metric columns. Keep the
  # value here in sync with the prose in `types.numeric_outlier.notes`
  # below; both must reference the same threshold or the variant
  # rewriter will drift.
  freetext_mean_length: 40   # pattern_inconsistency free-text length cutoff

base:
  system: >
    You are a meticulous data-quality auditor. You specialise in detecting
    ONE specific error type at a time. Other error types are handled by
    separate calls, so you must stay rigorously inside the lane defined
    below and ignore defects that belong to a sibling type.

    BE CONSERVATIVE. Real-world data is naturally varied, and most of the
    variation you will see is NOT an error. Precision matters far more
    than recall for this task: a plausible-looking "issue" that turns out
    to be legitimate content variation is a false positive and directly
    degrades the pipeline's value. When you cannot point to concrete,
    row-level evidence that a value is wrong, stay silent.

    CRITICAL - "THE WHOLE COLUMN IS WRONG" IS ALMOST ALWAYS A FALSE
    POSITIVE. If a pattern covers the majority of rows in a column, that
    pattern is the column's convention, not a defect. Never produce a
    finding whose affected rows cover >=80% of the non-empty rows in a
    column - the correct response in that case is an empty finding list.

    EMPTY CELLS. A cell is "empty" when it is NULL/NaN, the empty
    string ``""``, or whitespace-only (e.g. ``"   "``). Empty cells
    are NEVER an error in their own right unless an error type's
    APPLICABILITY NOTES explicitly say so. Exclude empty cells from
    every peer count, dominant-baseline denominator, and
    distributional statistic; never list an empty cell in
    ``affected_rows``.

    FAST-SKIP. If, after reading the APPLICABILITY NOTES, you can
    immediately tell that the slice is ineligible for this error type
    (wrong column kind, too few peers, free-text where structured is
    required, single-source slice for a multi-source defect, etc.),
    respond with exactly {"issues": []} and stop. Do not narrate why.

    Respond with strictly valid JSON - no prose outside the JSON payload
    and no Markdown code fences.

  user_template: |
    You are auditing a slice of a CSV for a SINGLE data-quality error
    type. Focus on this type only. Defects belonging to other types
    will be caught by their own dedicated detectors - do NOT flag them
    here.

    ERROR TYPE:    {type_name}
    TAXONOMY TAG:  {type_category}

    DEFINITION
    {type_description}

    REFERENCE EXAMPLES (for guidance only; may or may not appear in the data)
    {type_example}

    APPLICABILITY NOTES (read carefully - these disambiguate this type
    from its siblings)
    {type_notes}

    {table_overview}

    COLUMN HEADERS (comma separated; this is the COMPLETE set of columns
    you may reference - the slice may contain a single column or many,
    depending on the experiment configuration):
    {headers}

    ROWS (Markdown table; the first column `__row__` is the 0-indexed source
    row number from the CSV, covering rows [{start_row}, {end_row})):

    {rows}

    TASK
    ----
    Examine the slice above and flag every occurrence of a defect that
    falls under the "{type_name}" type as defined in the DEFINITION +
    APPLICABILITY NOTES. A single finding may be either:
      * a per-cell defect (one row, one or more columns), OR
      * a group-level defect that spans multiple rows in the same column
        (typical for representation / formatting inconsistencies), OR
      * a multi-column per-row defect (typical for cross-column
        contradictions).

    For group-level defects, emit ONE issue per group: set `row` to the
    first (smallest) affected row number, set `columns` to the affected
    column(s), and list ALL affected row numbers in `affected_rows`.

    GLOBAL RULES
    ------------
    The following rules apply to EVERY type. Per-type notes refine but
    do not override them.

    R1 - Empty default. If nothing applies, return exactly
         {{"issues": []}}. Do not invent issues. When in doubt, do NOT
         flag.

    R2 - Slice-size guard. Findings that rely on a distributional or
         majority argument (any rule mentioning a "dominant" baseline,
         a peer set, or "most rows") require AT LEAST ${peer_min}
         non-empty values in the relevant column inside this slice.
         With fewer than ${peer_min} peers, return {{"issues": []}} for
         those types. (Some types raise this floor further - see their
         per-type notes; e.g. numeric_outlier requires ${peer_min_outlier}.)

    R3 - Dominant baseline thresholds (the "GLOBAL DOMINANT BASELINE",
         used by every "inconsistency" type). A value/shape/encoding
         qualifies as DOMINANT only when it covers >=${dominant_pct}%
         of the non-empty rows in the column for the entity in
         question. The deviating MINORITY must together cover
         <=${minority_pct}%. If neither side reaches these thresholds,
         the column has no convention - return {{"issues": []}}.
         Group-level findings list ONLY the minority rows; never list
         the dominant rows. Per-type notes restate these numbers
         inline for readability; this rule is the source of truth -
         if a per-type note disagrees, follow R3.

    R4 - Majority guard. Never produce a finding whose `affected_rows`
         covers >=80% of the non-empty rows of a column. If a pattern
         covers >=80% of the column, that pattern IS the column's
         convention - return {{"issues": []}} for findings that would
         flag it.

    R5 - `columns` field. For a per-cell or multi-column intra-row
         finding, list the involved column(s). For a pure ROW-LEVEL
         finding (e.g. row_duplication of an entire row), set
         `columns: []`.

    R6 - `affected_rows` completeness. Group-level findings MUST list
         EVERY affected row number in `affected_rows`, sorted
         smallest-first. Do NOT truncate. The goal is to capture all
         data errors; an incomplete list manufactures false negatives
         downstream. Set `affected_rows_total` equal to
         len(`affected_rows`).

    R7 - Stay in your lane. Defects that look like they belong to a
         sibling type are skipped here - their dedicated detector
         will catch them.

    OUTPUT FORMAT
    -------------
    Respond with a single JSON object, no markdown fences:

    {{
      "issues": [
        {{
          "row": <int, the __row__ value; for group-level findings, the
                  smallest affected row number>,
          "columns": [<string column name>, ...],   // [] for pure row-level findings (R5)
          "affected_rows": [<int>, ...],            // optional; for group-level findings only
          "affected_rows_total": <int>,             // equal to len(affected_rows); see R6
          "observed": "<short verbatim snippet(s) of the problematic
                        value(s); for groups, list the distinct variants>",
          "explanation": "<1-2 sentence justification naming the
                          sub-pattern inside this type and - where
                          relevant - the canonical form(s) you propose>",
          "suggested_fix": "<concrete recommendation; null if unclear>"
        }}
      ]
    }}

    If nothing applies, return exactly: {{"issues": []}}

types:

  # =====================================================================
  # SINGLE-COLUMN
  # =====================================================================

  typo:
    name: "Typo"
    category: "Single-Column / Typo"
    description: >
      An isolated typographical or spelling mistake in a TEXT value.
      The value is objectively wrong (not a stylistic variant): a 1-2
      character distortion of a clearly-intended correct word. Usually
      identifiable because a more frequent, near-identical peer appears
      elsewhere in the same column, or because the value is a misspelling
      of a common domain word.
    example: |
      * "Misisipi" when "Mississippi" appears in peer rows.
      * "Unietd states" when other rows have "United States".
      * "recieve" instead of "receive".
      * "Divison" when other rows have "Division".
    notes: |
      WHAT TO FLAG
      * Per-cell finding: `row` = the offending row, `columns` = the
        single text column, `observed` = the misspelled value verbatim,
        `suggested_fix` = the corrected spelling.
      * Only flag when you can PINPOINT the intended spelling - usually
        because a one-/two-edit-distance peer appears in the same column,
        or it's an obvious mis-typing of a common domain word.
      * Be conservative on free-text prose (Notes, Description). Prefer
        identifier-like columns: organisation names, place names,
        statuses, units.

      WHAT NOT TO FLAG
      * Two distinct legitimate variants of the same entity ("USA" vs
        "United States") -> `text_inconsistency`.
      * Pure capitalisation differences ("james" vs "James") ->
        `casing_inconsistency`.
      * Punctuation / whitespace differences -> `punctuation_inconsistency`.
      * Format differences on structured values (dates, phones, IDs) ->
        `pattern_inconsistency`.
      * A value whose semantic type does not belong in the column (phone
        number in a Place Name column) -> `semantic_incompatible`.
      * Proper nouns whose correct spelling cannot be verified from the
        data alone.

  text_inconsistency:
    name: "Text Inconsistency"
    category: "Single-Column / Inconsistency"
    description: >
      Two or more distinct textual variants refer to the SAME real-world
      entity inside a single text column - abbreviations, alternative
      names, translations, or word-order differences. Each variant is
      individually valid; the defect is that peers in the column spell
      the same entity differently.
    example: |
      FLAG
      * "USA" / "United States" / "U.S.A." in the same Country column.
      * "Ministry of Education" / "MoE" in the same Agency column.
      * "Fiji Red Cross Society" / "Fiji RCS" / "FRCS".

      DO NOT FLAG
      * "USA" appearing 3 times and "Canada" appearing 5 times in a
        Country column - those are different entities, not variants of
        one entity.
      * Two languages of the same name in a bilingual dataset where
        both spellings clearly coexist by design.
      * "john smith" vs "John Smith" - pure casing -> `casing_inconsistency`.
      * "Smtih" vs "Smith" - one-character distortion -> `typo`.
    notes: |
      WHAT TO FLAG
      * Only flag when ONE variant clearly DOMINATES the column for a
        given entity (covers >=60% of non-empty rows for that entity)
        and a small minority spells it differently. Emit a group-level
        finding covering ONLY the minority rows:
          - `row`: the smallest MINORITY row
          - `columns`: the single affected column
          - `affected_rows`: ONLY the minority rows that deviate from
            the dominant variant (list ALL of them per R6; do NOT
            truncate). Do NOT list the dominant-variant rows.
          - `observed`: "dominant: '<dominant variant>'; minority:
            '<variant A>', '<variant B>'".
          - `suggested_fix`: rewrite the minority values to the
            dominant variant.
      * If no single variant covers >=60% of rows for the entity, the
        column simply uses multiple legitimate spellings side-by-side
        (a bilingual dataset, a mixed convention) - do NOT flag.

      WHAT NOT TO FLAG
      * Spelling MISTAKES (1-2 char distortion of a known-correct word)
        -> `typo`.
      * Pure capitalisation differences with the same letters ->
        `casing_inconsistency`.
      * Punctuation-only differences -> `punctuation_inconsistency`.
      * Format-shape differences on structured values (codes, dates) ->
        `pattern_inconsistency`.
      * Free-text prose where natural variation is expected.

  casing_inconsistency:
    name: "Casing Inconsistency"
    category: "Single-Column / Inconsistency"
    description: >
      Inconsistent CAPITALISATION across cells that otherwise contain
      the same letters in the same order. The text is identical
      character-for-character apart from upper/lower case differences.
    example: |
      * "james smith" vs. "James Smith" vs. "JAMES SMITH"
      * "ID-123" vs. "id-123"
      * "ongoing" vs. "Ongoing" vs. "ONGOING" in a Status column.
    notes: |
      WHAT TO FLAG
      * Compare values case-insensitively. Only flag when, after
        case-folding, two or more rows are IDENTICAL but their original
        casing differs.
      * Apply the same dominant-baseline rule as `text_inconsistency`:
        ONE casing must clearly dominate (>=60% of the rows that share
        the case-folded form) before you flag the minority.
      * Emit a group-level finding listing ONLY the minority rows.
        `observed`: "dominant casing: '<dominant>'; minority: '<a>', '<b>'".

      WHAT NOT TO FLAG
      * Different LETTERS, even with different case -> `typo` or
        `text_inconsistency`.
      * Capitalisation differences inside free-text prose where casing
        is naturally unconstrained.
      * Acronyms vs. full names ("MoE" vs "Ministry of Education") ->
        `text_inconsistency`.
      * A column where mixed casing is the established convention
        (i.e. no single dominant casing).

  pattern_inconsistency:
    name: "Pattern Inconsistency"
    category: "Single-Column / Inconsistency"
    description: >
      Within a single STRUCTURED or SEMI-STRUCTURED column, a small
      MINORITY of rows uses a different syntactic SHAPE than the
      dominant pattern used by the majority. The values represent the
      same semantic data but fail to conform to a standardised syntax
      or layout. The defect is the minority rows that break the
      column's convention - NOT the mere existence of variation.

      This is a HIGH-PRECISION detector. Pattern_inconsistency is
      commonly over-flagged; most apparent "variation" in real data is
      natural content variation, not a format conflict. When no single
      pattern clearly dominates, the column simply has no convention
      yet - SKIP it.
    example: |
      FLAG (clear coexistence of STRUCTURAL shapes for the same concept)
      * Phones:    "800-123-4567" / "(800) 123-4567" / "8001234567"
      * Dates:     "01/01/2011"   / "2011-01-01"   / Excel serial "42459"
      * Codes:     "FJ01"         / "FJ-01"
      * Postal:    "94103"        / "94103-2918"
      * Times:     "14:30"        / "2:30 PM"

      DO NOT FLAG
      * Free-text columns (Name, Description, Notes, Address).
      * Same regex shape, different content: "5" / "42" / "1000" (all
        digits - same shape).
      * Names with 1, 2, or 3 tokens ("Mary" / "Mary Jane Smith").
      * Number-format-only differences (% vs decimal, commas vs none)
        -> `number_format_inconsistency`.
      * Punctuation-only differences (en dash vs em dash, hyphen
        repetition) -> `punctuation_inconsistency`.
    notes: |
      HARD PRE-CHECK - SKIP THE COLUMN UP-FRONT IF EITHER IS TRUE.
      Skip (return {{"issues": []}} immediately) when ANY of the
      following holds for the column:
        * The column header (case-insensitive) is in the free-text
          set: {Name, Description, Notes, Address, Comment, Title,
          Summary, Remarks, Detail, Details, Body, Bio}.
        * The mean length of non-empty values exceeds 40 characters
          (free-text proxy).
      These columns are free-text prose: legitimate variation in
      wording is not a pattern defect.

      PRE-CHECK - IS THIS COLUMN EVEN ELIGIBLE?
      Eligible: dates, times, phones, postal/ZIP codes, IDs/codes,
      URLs, emails, file paths, coordinates, strict enumerations
      written with hyphens/spaces.
      Ineligible: free-text prose, human/org/place names (unless a
      strict code like a PCode), addresses written as free text.
      For ineligible columns, return {{"issues": []}}.

      WHAT TO FLAG
      * Tokenise each value into character classes (digits D, letters
        A, separators -, /, :, space, parens). Two values differ in
        PATTERN only if shape differs in TOKEN KIND or TOKEN ORDER -
        NOT merely in the count of digits or letters.
            SAME pattern:      "5" / "42" / "1000"
            DIFFERENT pattern: "800-123-4567" / "8001234567"
      * DOMINANT-BASELINE REQUIREMENT: the dominant pattern must cover
        >=60% of non-empty rows AND deviating rows must together cover
        <=40%. Otherwise return {{"issues": []}}.
      * FLAG ONLY THE MINORITY in `affected_rows` (list ALL minority
        rows per R6; do NOT truncate).
      * SINGLETON RULE: a deviating pattern backed by exactly one row
        is more likely a typo / corrupt row -> route to `typo` or
        `semantic_incompatible`, skip here.
      * Emit ONE group-level issue per affected column:
          - `observed`: "dominant: <pattern> ('<sample>'); minority:
            <pattern> ('<sample>')"
          - `suggested_fix`: rewrite minority values to dominant pattern.

      WHAT NOT TO FLAG
      * Number formatting (% vs 0.x, comma separators) ->
        `number_format_inconsistency`.
      * Punctuation marks differing alone -> `punctuation_inconsistency`.
      * Pure casing differences -> `casing_inconsistency`.
      * Spelling mistakes -> `typo`.
      * Out-of-domain values -> `semantic_incompatible`.

  punctuation_inconsistency:
    name: "Punctuation Inconsistency"
    category: "Single-Column / Inconsistency"
    description: >
      Within a single column, values use inconsistent PUNCTUATION marks
      (hyphen vs en dash vs em dash, single vs double quotes, period
      sequences), or carry incidental leading / trailing whitespace.
      The shape of the value is otherwise identical - only its
      punctuation differs.
    example: |
      * "123-456" vs. "123\u2013456" (hyphen vs en dash)
      * "123-456" vs. "123---456"   (single hyphen vs triple)
      * " james smith " vs. "james smith"  (whitespace padding)
      * "St. Mary" vs. "St Mary"    (period vs none)
    notes: |
      WHAT TO FLAG
      * Compare values after stripping leading/trailing whitespace.
        Flag rows whose padding clearly deviates from the column's norm.
      * Compare values after Unicode-normalising punctuation
        (hyphen / en dash / em dash, smart vs straight quotes).
        Flag minority rows whose punctuation differs from the dominant
        choice in the column.
      * Apply the same DOMINANT-BASELINE rule as `pattern_inconsistency`:
        only flag when ONE punctuation/whitespace style clearly dominates
        the column. Emit a group-level finding listing only the minority
        rows.
      * `observed`: "dominant: '<dominant>'; minority: '<a>', '<b>'".

      WHAT NOT TO FLAG
      * Whole-shape changes (digit/letter count, separator placement
        moving) -> `pattern_inconsistency`.
      * Pure casing differences -> `casing_inconsistency`.
      * Spelling mistakes -> `typo`.
      * Free-text columns where punctuation is naturally inconsistent.
      * Punctuation differences that visibly change MEANING (e.g. a
        comma turning a number into something else - that is
        `number_format_inconsistency` or `pattern_inconsistency`).

  number_format_inconsistency:
    name: "Number Format Inconsistency"
    category: "Single-Column / Inconsistency"
    description: >
      Within a single column that MEASURES A QUANTITY (a count,
      amount, percentage, currency, ratio, or other magnitude), values
      use mixed numeric encodings - percentages mixed with decimals,
      comma thousands-separators mixed with bare digits, currency
      symbols inconsistently attached, parentheses for negatives mixed
      with leading minus, scientific notation mixed with fixed-point,
      and so on. Each value is individually a valid number; the defect
      is that the column uses multiple encodings for the SAME KIND of
      measurement, such that the numeric meaning is preserved when you
      rewrite one form to the other (e.g. 15% == 0.15, 10,000 ==
      10000).
    example: |
      * "15%" mixed with "0.15" in the same percentage column.
      * "10,000" mixed with "10000" in a count column.
      * "$1,000.00" mixed with "1000" in a currency column.
      * "(50)" mixed with "-50" for negatives.
      * "1.2e6" mixed with "1200000".
    notes: |
      QUANTITATIVE-COLUMN GATE (read this FIRST)
      * Apply this type ONLY when the column measures a QUANTITY:
        a count, amount, percentage, currency, ratio, rate, score,
        magnitude, duration, etc. The arithmetic value of the cell
        must be what the column is reporting.
      * If the column holds CODES or IDENTIFIERS - values whose
        digits are categorical labels rather than magnitudes - return
        exactly {{"issues": []}}. Examples that are NOT quantitative
        and MUST be skipped here:
          - postal/zip/FIPS/area/country/state/county/town codes
          - product codes, SKUs, account numbers, license numbers
          - phone numbers, SSNs, route numbers, classification codes
          - any column where leading zeros, fixed widths, or
            alphanumeric mixing carry semantic meaning
        For these columns, '01' is NOT numerically equivalent to '1';
        rewriting one to the other LOSES information. Length / padding
        differences in code columns are a `pattern_inconsistency`
        question (and only when lengths actually mix), never a NFI
        question.
      * Heuristics that the column is a CODE, not a quantity:
          - column name contains 'code', 'id', 'number' as a label
            (zip, FIPS, postal, route, account), or all values share a
            short fixed width (2-5 digits) with leading zeros;
          - values are never aggregated, averaged, or compared
            arithmetically in any plausible downstream use;
          - the dominant 'inconsistency' you would flag is JUST a
            difference in zero-padding or string length.
        If any of these apply, FAST-SKIP with {{"issues": []}}.

      WHAT TO FLAG (after passing the gate above)
      * Identify the dominant encoding (>=60% of non-empty rows use
        the same encoding). Emit a group-level finding listing EVERY
        minority row that uses a different encoding. Do not cap or
        sample the list (R6).
      * The dominant and minority forms must denote the SAME numeric
        value when normalised. If they don't (e.g. one is a code,
        one is a quantity), this is not NFI.
      * `observed`: "dominant encoding: <kind> ('<sample>'); minority:
        <kind> ('<sample>')". Include enough context that downstream
        review can see both forms side-by-side.
      * `suggested_fix`: rewrite the minority values to the dominant
        encoding (e.g. "convert percentages to decimals" or "strip
        thousands separators").

      WHAT NOT TO FLAG
      * Code / identifier columns (see gate above).
      * Zero-padding differences in fixed-width code columns.
      * Non-numeric pattern differences (date layouts, code shapes) ->
        `pattern_inconsistency`.
      * Punctuation-only quirks that don't change the numeric value
        (e.g. inconsistent thin space vs hard space) ->
        `punctuation_inconsistency`.
      * A single outlier number whose magnitude is wildly off ->
        `numeric_outlier` or `semantic_incompatible`.
      * Currency mismatches across SOURCES (USD vs EUR) when the data
        is merged from multiple systems -> `inter_table_inconsistency`.

  semantic_incompatible:
    name: "Semantic Incompatible"
    category: "Single-Column / Semantic"
    description: >
      A cell whose semantic TYPE / DOMAIN does not match the column it
      sits in. The value is recognisable as something - a phone number,
      a date, a name - but it belongs in a different column. Detection
      is per-cell against the inferred semantic identity of the column.
    example: |
      * A phone number sitting in a "Name" column.
      * A name sitting in a "Salary" column.
      * A free-text narrative sitting in an integer-count column.
      * A status of "Pending review" in a column whose observed domain
        is {{Open, Closed}}.
    notes: |
      WHAT TO FLAG
      * For each column, FIRST infer its semantic domain from the
        surrounding non-empty values: integer count? date? enumerated
        status? geographic name? monetary amount?
      * Per-cell finding: `row` = offending row, `columns` = the single
        column, `observed` = the offending value, `explanation` names
        the column's inferred domain and what the value actually is.
      * Be conservative. A value that COULD be coerced to the column's
        domain (a number written with commas in a numeric column) is
        not semantically incompatible - it's a format issue.

      WHAT NOT TO FLAG
      * Out-of-distribution NUMERIC values inside a numeric column ->
        `numeric_outlier`.
      * Spelling mistakes -> `typo`.
      * Format / encoding differences where the underlying domain is
        correct -> `pattern_inconsistency` or
        `number_format_inconsistency`.
      * Cross-column factual / FD conflicts (Country/Capital mismatch,
        Zip/State mismatch) -> `fd_violation`.

  numeric_outlier:
    name: "Numeric Outlier"
    category: "Single-Column / Distribution"
    description: >
      Inside a numeric column, a value sits FAR from the bulk of the
      column's distribution AND there is no plausible real-world
      reason it should be that large/small. The defect is a value
      that looks like a data-entry mistake (typo, wrong unit, stray
      digit) - not merely a legitimately large observation in a
      naturally heavy-tailed quantity.

      Be CONSERVATIVE. Most "extreme-looking" numbers in real-world
      tables (death counts, case counts, sales spikes, populations,
      revenues) are genuine. Only flag when both (a) the gap is
      large AND (b) the value is implausible for what the column
      measures.
    example: |
      DO flag:
      * A salary of $1,000,000 when peer values cluster $50k-$120k
        AND nothing about the row (title, role) explains it.
      * A quantity of 10,000 in a column otherwise containing 1-50,
        with no unit/scale change visible.
      * A year of "20200" when other rows are 2000-2024 (extra digit,
        clearly a typo).
      * An age of 250 in a person-level table (physically impossible).

      DO NOT flag (numerically extreme but semantically plausible):
      * 15 reported deaths in an "incidence" / case-count column
        where most rows are 0-1. Death/case counts are heavy-tailed;
        a single bad outbreak is real data, not an error.
      * A $5M order in a revenue column where most rows are $10k-$50k
        - large customers exist; flag only if the magnitude is
        physically impossible for the entity.
      * Population of 8M for a capital city in a list whose other
        rows are towns of 5k-50k - capitals are legitimately larger.
      * A 2024 row with 4x the value of 2020-2023 in a growth/usage
        metric - growth spikes happen.
    notes: |
      HARD PRE-CHECK - SKIP THE COLUMN UP-FRONT IF EITHER IS TRUE.
      Skip (return {{"issues": []}} immediately) when ANY of the
      following holds for the column:
        * The column does not contain numeric (or numeric-like)
          values - free text, identifiers, dates, codes are not in
          scope here.
        * Fewer than ${peer_min_outlier} peer DETAIL rows (i.e.
          excluding the total/summary rows defined below) are
          visible in the chunk. Tighter than the global R2 minimum
          of ${peer_min}: distributional claims need a real
          distribution.

      EXCLUDE TOTAL / SUMMARY ROWS BEFORE COMPARING.
      Drop any row whose first cell, label column, or known
      identifier column matches /total|sum|grand[- ]?total|subtotal|
      average|avg|mean|aggregate/ (case-insensitive). Such rows are
      derived aggregates and routinely much larger than peers; their
      magnitude is the design, not an outlier. Apply the
      distributional argument only to the remaining detail rows.

      WHAT TO FLAG (ALL conditions must hold)
      * The column passed the HARD PRE-CHECK above.
      * Statistical gap: the value is at least an order-of-magnitude
        away from the median, OR >=${iqr_multiple} IQR from the
        median (raised from 3 - be stricter). A value that is merely
        the largest in a small sample is NOT enough.
      * Plausibility check: write down what the column measures, then
        ask "could a real entity legitimately have this value?" Only
        flag if the answer is clearly NO (typo, extra digit, wrong
        unit, physically impossible).
      * `explanation` MUST cite both pieces of evidence: peer summary
        AND why the value is implausible. E.g. "median ~75k, IQR
        ~30k; this row is 10M, ~130 IQRs above median, and the role
        'Junior Analyst' makes 10M implausible."
      * Per-cell finding. For multiple outliers in the same column,
        use a group-level finding listing ALL outlier rows in
        `affected_rows` per R6 (do NOT truncate).

      WHAT NOT TO FLAG
      * HEAVY-TAILED COUNT / EVENT COLUMNS. Death tolls, case counts,
        casualty figures, earthquake magnitudes, sales spikes,
        follower counts, view counts, etc. are inherently
        heavy-tailed - one row at 15 when most are 0-1 is normal
        variation, NOT an outlier. Do not flag unless the value is
        physically impossible (e.g. >world population).
      * The single largest / single smallest value in a small chunk,
        when no other evidence suggests an error.
      * Non-numeric values that don't belong in the column ->
        `semantic_incompatible`.
      * Mild variation. Do NOT flag values that are merely "large" or
        "small" without a concrete distributional argument AND a
        plausibility argument.
      * Format-only quirks (one row uses "%" while others are
        decimals) -> `number_format_inconsistency`.
      * A row whose number violates an algebraic relation
        (price*qty != total) -> `row_calculation_inconsistency`.
      * A whole column whose magnitudes look "off" but consistently so
        (likely a unit choice, not an error).
      * When in doubt, DO NOT FLAG. False positives on this type are
        more harmful than missed outliers; downstream consumers can
        spot extremes themselves.

  # =====================================================================
  # MULTI-COLUMN (intra-row)
  # =====================================================================

  fd_violation:
    name: "FD (Functional Dependency) Violation"
    category: "Multi-Column / Intra-Record"
    description: >
      A violation of a STRICT, KNOWN functional dependency between
      attributes: a "determinant" column's value implies a specific
      dependent value, and the dependent column disagrees. Detected
      either within a single row (using known real-world FDs) or
      across rows that share the same determinant value.

      Requires column_mode='all'.
    example: |
      * Same Zip code appears with two different States across rows.
      * Same ProductCode appears with two different ProductCategory
        values.
      * Same EmployeeID appears with two different Departments.
      * Country = "France" implies Capital = "Paris" (within-row FD).
    notes: |
      WHAT TO FLAG
      * Identify candidate determinants: codes, IDs, postal codes,
        identifiers that should map deterministically to a dependent
        attribute.
      * Across-row: group rows by the determinant value; flag groups
        that disagree on the dependent column. Group-level finding:
          - `row`: smallest affected row
          - `columns`: [determinant, dependent]
          - `affected_rows`: every row in the disagreeing group
          - `observed`: e.g. "Zip=94103 -> State=CA (rows 3,4) vs
            State=NY (row 17)"
      * Within-row: only when the FD is strong real-world knowledge
        (Zip->State, Country->Capital). Per-row finding.

      WHAT NOT TO FLAG
      * Soft / approximate dependencies (City -> Region typically but
        with exceptions) - too easy to false-positive.
      * Numeric derivations between row columns ->
        `row_calculation_inconsistency`.
      * String composition / concatenation rules (FullName == First +
        " " + Last) -> `string_calculation_inconsistency`.
      * Two rows that are exact duplicates -> `row_duplication`.
      * Disagreements ACROSS tables / sources for the same entity ->
        `inter_table_inconsistency`.

  row_calculation_inconsistency:
    name: "Number / Calculation Inconsistency"
    category: "Multi-Column / Intra-Record"
    description: >
      Within a single row, NUMERIC fields fail to satisfy an expected
      mathematical formula or derivation: a "derived" numeric column
      does not equal the algebraic combination of its component
      numeric columns.

      Requires column_mode='all'.
    example: |
      * unit_price=10, quantity=3, total_price=35 (expected 30).
      * subtotal=90, tax=9, total=110 (expected 99).
      * start=100, end=120, delta=15 (expected 20).
      * principal=1000, rate=0.05, interest=60 (expected 50).
    notes: |
      WHAT TO FLAG
      * Identify columns whose headers / typical magnitudes suggest an
        algebraic relation (price*qty=total, subtotal+tax=total,
        end-start=delta, a+b=c).
      * Check each row; flag rows where the relation fails by more
        than a rounding tolerance (>= 0.01 of the expected value, or
        any integer mismatch for integer columns).
      * Per-row finding: `columns` = every component plus the derived
        column; `observed` = "a=10, b=3, c=35 (expected 30)";
        `explanation` names the relation.
      * Use reasonable rounding tolerance - DO NOT flag floating-point
        noise.

      WHAT NOT TO FLAG
      * String composition (FirstName + LastName != FullName) ->
        `string_calculation_inconsistency`.
      * A single value numerically unusual but not an algebraic
        inconsistency -> `numeric_outlier`.
      * Mixed number formats (with/without commas) ->
        `number_format_inconsistency`.
      * Non-arithmetic determinant/dependent disagreements (Zip vs
        State, ProductCode vs Category) -> `fd_violation`.
      * Relations you cannot confidently derive from the headers
        alone - this detector should be conservative.

  string_calculation_inconsistency:
    name: "String / Calculation Inconsistency"
    category: "Multi-Column / Intra-Record"
    description: >
      Within a single row, STRING-valued fields fail to satisfy an
      expected derivation, concatenation, or composition rule across
      columns: a "composed" string column does not match the
      deterministic combination of its component string columns.

      Requires column_mode='all'.
    example: |
      * FirstName="Alice", LastName="Brown", FullName="Bob Smith"
        (FullName should equal "Alice Brown").
      * City="Paris", Country="France", Location="Berlin, Germany"
        (Location should be "Paris, France").
      * Street="123 Main St", City="NY", Zip="10001",
        Address="456 Oak Ave, NY 10001" (Address does not include
        the row's Street value).
      * Domain="example.com", User="alice", Email="bob@example.com"
        (Email should be "alice@example.com").
    notes: |
      WHAT TO FLAG
      * Identify columns whose headers strongly suggest a string
        composition rule (FullName from First+Last; Address from
        Street+City+Zip; Email from User+Domain; URL from Scheme+Host
        +Path; SKU from Brand+Code).
      * Check each row; flag rows where the composed column does not
        match the deterministic combination of the components after
        reasonable normalisation (case-folding, whitespace
        collapsing, separator tolerance: " ", ", ", " - ").
      * Per-row finding: `columns` = every component plus the composed
        column; `observed` = the actual vs expected string;
        `explanation` names the composition rule.
      * Be conservative on natural-language fields where ordering or
        wording is genuinely flexible (e.g. "Smith, Alice" vs
        "Alice Smith" may both be acceptable representations of the
        same name).

      WHAT NOT TO FLAG
      * Numeric derivations -> `row_calculation_inconsistency`.
      * Strict identifier-based FDs (Zip->State, ProductCode->Name)
        -> `fd_violation`.
      * Pure casing / spelling / formatting differences on a single
        column -> `casing_inconsistency` / `typo` /
        `pattern_inconsistency`.
      * Free-text Notes / Description columns where no deterministic
        composition is expected.
      * Composition rules you cannot confidently derive from the
        headers alone - this detector should be conservative.

  # =====================================================================
  # MULTI-ROW (intra-table cross-row)
  # =====================================================================

  row_duplication:
    name: "Row Duplication Error"
    category: "Multi-Row / Inter-Record"
    description: >
      Two or more rows that refer to the IDENTICAL real-world entity
      with identical (or near-identical) attribute values - typically
      caused by repeated ingestion or a join gone wrong.

      Requires column_mode='all' for reliable detection.
    example: |
      * Two rows where every visible column has identical values,
        representing the same transaction recorded twice.
      * Three rows that are character-for-character identical.
    notes: |
      WHAT TO FLAG
      * Set of rows where every observed column has an identical
        non-empty value.
      * Group-level finding:
          - `row`: smallest row in the duplicate group
          - `columns`: [] or the full column set
          - `affected_rows`: every row in the duplicate group
          - `observed`: "<N> duplicate rows"
          - `explanation`: "row_duplication: identity=<...>"
      * Works best with column_mode='all'. With column_mode='single',
        only flag when the column visibly carries unique-identifier
        semantics and exact repeats are clearly defects.

      WHAT NOT TO FLAG
      * Near-duplicates caused only by formatting differences on
        structured columns - first apply `pattern_inconsistency` /
        `number_format_inconsistency`; only flag here if, after a
        mental normalisation, the rows are genuine duplicates.
      * Distinct entities that merely look similar.

  # =====================================================================
  # MULTI-TABLE (cross-source)
  # =====================================================================
  #
  # The chunk typically shows a single table; evidence for this type
  # mostly lives OUTSIDE the slice. Findings will be RARE. Only flag
  # when the slice itself contains the disagreeing pieces (e.g. two
  # source blocks stacked in the same CSV, an FK-like value that is
  # self-evidently malformed against the controlled set visible in the
  # slice, or two parts of a workbook coexisting with mismatched
  # encodings).

  inter_table_inconsistency:
    name: "Inter-table Inconsistency"
    category: "Multi-Table / Relational"
    description: >
      Conflicting or incompatible values describing the same
      real-world entity, key, or attribute across multiple tables or
      sources. This umbrella covers (a) referential-integrity breaks
      (a key value in a child table has no match in the parent),
      (b) cross-source attribute disagreements (the same entity has
      different addresses / amounts / statuses in two tables), and
      (c) representation mismatches across sources (different units,
      scales, or encodings used for the same concept; same header
      naming different concepts or different headers naming the same
      concept).
    example: |
      * A row references "Dept 127" but no Dept 127 exists in the
        parent Departments table.
      * Customer "C001" has address "1 Main St" in the Customers
        table but address "9 Oak Ave" in the Orders table for the
        same period.
      * Sales recorded in USD in one source block and EUR in another
        with no currency column to disambiguate.
      * Gender coded as 0/1 in block A and M/F in block B for the
        same population.
      * Block A uses header "CustomerID"; block B uses
        "ClientNumber" for what is clearly the same join key.
    notes: |
      DEFAULT BEHAVIOUR.
      The slice is almost always a single table with no sibling
      table visible. Unless the chunk itself contains the
      disagreeing pieces, return {{"issues": []}}. Do NOT speculate
      from column names alone.

      WHAT TO FLAG (only when the disagreement is fully visible
      inside the slice)
      * Per-cell finding when an FK-like column carries a value that
        falls clearly outside the observed controlled set in the
        slice.
        `explanation`: "inter_table_orphan: <column> value '<v>' not
        in observed set {{<...>}}".
      * Group-level finding when two sub-blocks of the slice describe
        the same identity but disagree on a descriptive attribute.
        `explanation`: "inter_table_attribute_conflict: <identity>
        differs on <column>".
      * Group-level finding when a column appears in two visible
        source blocks with clearly different encodings, scales, or
        units, AND no metadata column disambiguates.
        `explanation`: "inter_table_representation: <unit / scale /
        coding>".
      * Group-level finding when two visible source blocks use
        different header names for the same concept, or the same
        header name for clearly different concepts.
        `explanation`: "inter_table_naming: <synonym|homonym>".

      WHAT NOT TO FLAG
      * Within-table FD violations -> `fd_violation`.
      * Within-table duplicate rows -> `row_duplication`.
      * Single-source columns whose values use mixed encodings ->
        `number_format_inconsistency` or `pattern_inconsistency`.
      * Format-only differences on identifier columns ->
        `pattern_inconsistency` or `casing_inconsistency`.
      * Anything that requires evidence from a parent table or
        sibling source not visible in the chunk - return
        {{"issues": []}} rather than speculating.

