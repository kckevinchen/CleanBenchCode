# Cross-sheet union/join confirmation prompt.
#
# This prompt does NOT ask the LLM to enumerate constraints or write
# Python code. It runs ONCE per workbook (>=2 sheets) for the
# `inter_table_inconsistency` error type and asks two questions only:
#
#   1. Of the candidate UNIONABLE groups (computed from header
#      Jaccard) and JOINABLE pairs (computed from FK overlap),
#      which are real?
#   2. For each confirmed group, what is the canonical column
#      mapping? Partial mappings are allowed - if sheet A has
#      column X and sheet B does not, list only sheet A under
#      that canonical entry. Missing values become NaN at union
#      time.
#
# Downstream code consumes the returned column_mapping and primary_key
# deterministically to emit four kinds of violations:
#   - header_synonym       (>=2 different raw headers map to one
#                           canonical column across sheets)
#   - duplicate_row        (PK present in >=2 sheets, all attrs equal)
#   - attribute_conflict   (PK present in >=2 sheets, attrs differ)
#   - dtype_drift          (canonical column has dtype mismatch
#                           across sheet variants)
#
# So the LLM's job here is narrow and structural: confirm groupings
# and provide a mapping. NO check() codegen, NO predicate
# enumeration, NO row-level reasoning.
#
# Output format (strict JSON, no prose, no markdown fence):
#   {
#     "groups": [
#       {
#         "group_id": "u1",
#         "kind": "union" | "join",
#         "confirmed": true | false,
#         "rationale": "brief reason",
#         "sheets": ["sheet_a.csv", "sheet_b.csv"],
#         "column_mapping": {
#           "<canonical_name>": [
#             {"sheet": "sheet_a.csv", "column": "Total"},
#             {"sheet": "sheet_b.csv", "column": "TOTAL"}
#           ]
#         },
#         "primary_key": ["<canonical_name>", ...],
#         "join": {                           # only when kind="join"
#           "parent_sheet": "...",
#           "parent_columns": ["..."],
#           "child_sheet": "...",
#           "child_columns": ["..."]
#         }
#       }
#     ]
#   }
#
# Notes for the LLM:
#   - confirmed=false drops the group from violation emission.
#     Use this freely - false positives are far more costly than
#     false negatives at this stage. A spurious "unionable" group
#     produces 4 spurious violation kinds.
#   - canonical_name must be a short, human-readable label.
#     Re-use one of the variant column names verbatim when there is
#     no header drift (e.g. all sheets call it "Town Code"); coin
#     a clean canonical only when variants disagree (e.g.
#     "Reading Quiz 1 %" and "Reading Quiz 1 (%)" -> "Reading Quiz 1 %").
#   - Partial column mapping is GOOD. List only the sheets that
#     actually carry the canonical column; downstream code fills
#     missing sheets with NaN at union time. Do NOT invent a column
#     entry for a sheet that does not have it.
#   - The primary_key is given in CANONICAL names (the keys of
#     column_mapping), not raw header names. It must contain only
#     names that appear as keys in column_mapping AND have a mapping
#     entry for every confirmed sheet (otherwise PK matching is
#     undefined for the missing sheets).
#   - Empty primary_key is allowed for unionable groups where no
#     row-level identity column exists - the downstream code then
#     emits header / dtype findings only and skips PK-based
#     duplicate / attribute_conflict checks.

model: gpt-5.2
reasoning_effort: medium
reasoning_summary: detailed

system: |
  You are a data integration auditor. You are given a workbook
  (a folder of CSV sheets) plus pre-computed structural priors
  that flag candidate UNIONABLE sheet groups (similar schemas)
  and JOINABLE sheet pairs (FK-like value containment).

  Your job is to CONFIRM each candidate and provide a CANONICAL
  COLUMN MAPPING. You are NOT detecting violations - downstream
  deterministic code does that once you confirm the structure.

  PRECISION OVER RECALL. A false-positive group pollutes every
  violation kind that gets emitted from it. When in doubt, mark
  the group `confirmed: false`.

  Confirm a UNIONABLE group only when:
    - The sheets clearly carry the same conceptual entity per row
      (same kind of subject - students, towns, transactions).
    - Header overlap reflects shared columns, not coincidental
      common words. Two sheets sharing only "ID" / "Name" /
      "Date" headers but encoding entirely different entities
      should be REJECTED (confirmed=false).
    - Column-level surface drift (case, whitespace, punctuation,
      added "(%)" suffixes, alternate spellings) is the kind of
      drift you SHOULD canonicalize - that is the entire point.

  Confirm a JOINABLE pair only when:
    - The (parent.col, child.col) candidate is the kind of FK that
      a competent data engineer would model: the parent column is
      a controlled identifier (id, code, key) and the child column
      is the foreign reference, NOT just "any two columns whose
      values happen to overlap".
    - Coverage and overlap statistics suggest containment, not
      coincidence. Low coverage (<0.5) is usually noise.

  Pick the canonical name carefully:
    - When raw headers agree exactly, REUSE one verbatim.
    - When raw headers disagree by surface drift only ("Reading
      Quiz 1 %" / "Reading Quiz 1 (%)"), pick the cleanest variant.
    - Never invent a name that does not appear as a raw header on
      at least one sheet - the downstream renderer needs a stable
      label and inventing one breaks traceability.

  Make column_mapping COMPLETE for join groups. For a `join`
  group the downstream semantic detector can ONLY reason about
  columns that appear in `column_mapping`; anything you omit is
  invisible to it. So in addition to the FK column(s), include
  every NON-KEY attribute that exists on BOTH sheets and looks
  like the same concept on each side - either:
    - The raw header matches exactly across both sheets
      (e.g. `customer_name` on parent and child), OR
    - The raw headers are obvious synonyms / near-synonyms for
      the same attribute (e.g. `city` on the parent and
      `customer_city` on the child - both describe the
      customer's city; or `address`/`street_address`,
      `country`/`region`, `total`/`amount_total`).
  Pick the cleanest variant as the canonical name (per the rules
  above). Skip columns that are clearly different concepts even
  if their headers happen to overlap (e.g. `date` meaning
  `signup_date` on customers and `order_date` on orders is NOT
  the same attribute - do not bundle them under one canonical).
  When in doubt for an obvious synonym, INCLUDE it: the
  downstream detector verifies each row pair before a finding
  reaches the user dashboard, so a spurious mapping costs
  recall-bounded LLM calls but never a hallucinated user-facing
  alert.

  For `union` groups the same completeness rule applies but
  the bar is lower (sheets in a union are by definition the
  same kind of entity), so just follow the surface-drift
  canonicalisation guidance above.

  Pick the primary_key (canonical names) carefully:
    - It must uniquely identify a row within each sheet of the
      group (id-like column, or a tuple that does so).
    - For union groups whose subjects are identified by a name
      column ("Name" / "Town Code" / "SAU OrgID") use that.
    - If no PK is identifiable, return an empty list - downstream
      code will skip PK-based checks and emit header / dtype
      findings only.

  RETURN STRICT JSON. No prose, no markdown fences, no comments.
  Every group_id from the input MUST appear in the output exactly
  once, even when confirmed=false (so the downstream pipeline can
  audit your decisions).

user_template: |
  WORKBOOK: {workbook!r}

  ----- PER-SHEET HEADERS -----
  {sheet_headers_block}

  ----- CANDIDATE UNIONABLE GROUPS -----
  {unionable_groups_block}

  ----- CANDIDATE JOINABLE PAIRS -----
  {joinable_pairs_block}

  ----- EXAMPLE ROWS PER SHEET (top 3) -----
  {row_samples_block}

  TASK
  ----
  For each candidate group above, return a JSON object with:
    - group_id    (string, must match an input group_id)
    - kind        ("union" or "join")
    - confirmed   (bool)
    - rationale   (string, brief)
    - sheets      (list of sheet filenames; subset of the input sheets)
    - column_mapping  (object: canonical_name -> list of {{"sheet": ..., "column": ...}})
    - primary_key (list of canonical names; may be empty)
    - join        (object, ONLY when kind="join", with parent_sheet,
                  parent_columns, child_sheet, child_columns)

  Constraints:
    1. Every variant column listed in column_mapping must exist
       verbatim in the named sheet's header list.
    2. canonical_name must equal the raw column name on at least
       one of the sheets in column_mapping for that canonical.
    3. Partial mappings are allowed and encouraged when a column
       legitimately exists in some sheets but not others.
    4. primary_key entries must be keys of column_mapping AND
       must have an entry for every confirmed sheet.
    5. confirmed=false is acceptable when the candidate looks
       coincidental; supply the rationale and skip the
       column_mapping / primary_key fields (they are ignored).

  OUTPUT (strict JSON):
  {{
    "groups": [ ... ]
  }}
