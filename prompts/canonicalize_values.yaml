# Per-column key canonicalisation prompt.
#
# Used by src.core.row_duplication_detector.KeyCanonicalizer to bucket
# semantically-equivalent surface forms within a single key column
# BEFORE the duplicate-group enumeration. This catches cases where
# lexical normalisation (case-fold + strip-punct) cannot:
#
#   * "US" / "USA" / "United States"
#   * "Inc." / "Incorporated" / "Inc"
#   * "NY" / "New York" / "N.Y."
#   * "JFK" / "John F. Kennedy Airport"
#
# One LLM call per (source, key column) with cardinality below the
# configured cap. The model receives the full distinct-value list and
# returns equivalence classes; we then build a value -> canonical
# string map and pass it as a normaliser into
# enumerate_collision_groups.
#
# Placeholders (Python str.format; double braces escape literal JSON
# braces in the example):
#   source       - CSV file basename
#   column       - column header
#   value_list   - bullet list of distinct non-null values, one per
#                  line, prefixed with their original surface form
#                  in double quotes so the model can echo them back
#                  verbatim.

system: >
  You are a careful data-quality assistant. Given a list of distinct
  values from one column of a CSV, group together values that refer to
  the same real-world entity even when they differ in surface form
  (abbreviations, alternate names, alias punctuation, locale
  variations). Do NOT merge values that are merely similar but refer
  to distinct entities (e.g. "New York" and "New Jersey" are NOT
  equivalent). When in doubt, keep values in their own group. Respond
  with strictly valid JSON, no markdown fences, no prose outside the
  JSON payload.

user_template: |
  CONTEXT
  -------
  source: {source}
  column: {column}

  TASK
  ----
  Bucket the values below into equivalence classes. Two values belong
  to the same class iff they refer to the same real-world entity
  (synonym, abbreviation, alternate spelling, or locale variant).
  Values that look similar but refer to different entities MUST stay
  in separate classes.

  For each class, pick one ``canonical`` form using the following
  deterministic tiebreaker (apply rules in order; stop at the first
  rule that picks a unique winner):

  1. **Longest non-abbreviated form.** Prefer the spelt-out variant
     over an abbreviation or initialism. ``"United States"`` beats
     ``"USA"``; ``"New York City"`` beats ``"NYC"``. If two members
     are both fully spelt out, prefer the longer one.
  2. **Most frequent in the input.** If lengths tie, pick the form
     that appears most often in ``VALUES``.
  3. **First occurrence.** If still tied, pick the form that appears
     first in ``VALUES``.

  Values you are not sure about should be put in their own singleton
  class.

  VALUES
  ------
  {value_list}

  RESPONSE
  --------
  Respond with a JSON object of the form:

  {{
    "groups": [
      {{
        "canonical": "<one of the values, verbatim>",
        "members":  ["<value>", "<value>", ...]
      }},
      ...
    ]
  }}

  Rules:
  * Every input value MUST appear in exactly one ``members`` list.
  * ``canonical`` MUST be one of the listed members of its own group.
  * Singletons (values with no equivalents) are valid groups too.
  * Echo each value VERBATIM, character-for-character, including case
    and punctuation, so we can map back to the original cells.
