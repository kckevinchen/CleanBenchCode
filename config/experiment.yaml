# Experiment configuration.
# Override individual values from the CLI with --key value flags.

experiment:
  # Overall experiment strategy, consumed by
  # `python -m experiments.run_cleaning_detection`.
  #   single   -> one detection pass over each CSV (classic Phase A +
  #               Phase B pipeline). No perturbation, no Good-Turing.
  #   adaptive -> run up to `good_turing.num_runs` perturbed passes,
  #               recompute the Good-Turing / Chao1 false-negative
  #               estimate after each pass, and stop according to the
  #               `good_turing.mode` rule (adaptive early-stop or
  #               fixed K). The final Phase-A clusters / Phase-B
  #               synthesis / HTML dashboard are built from the UNION
  #               of detections across all passes; the estimator
  #               artifacts land under `good_turing/` inside the run
  #               output directory.
  #
  # CLI override: `--mode single|adaptive`.
  mode: adaptive
  name: data_cleaning_error_detection
  description: >
    Per-type data-cleaning error detection: for each CSV chunk, ask a
    GPT-5 family model one question per error type in the taxonomy.
    The taxonomy is the 9 fine-grained error types from
    error_type.csv, defined in prompts/error_types.yaml. Keys,
    grouped by Scope:
      Single-Column:
        - typo
        - inconsistency  (umbrella: text / casing / pattern /
                          punctuation / number_format sub-patterns;
                          each finding names its sub-pattern in the
                          explanation)
        - semantic_incompatible
        - numeric_outlier
      Multi-Column (intra-row):
        - fd_violation
        - row_calculation_inconsistency
        - string_calculation_inconsistency
      Multi-Row (intra-table cross-row):
        - row_duplication
      Multi-Table (cross-source):
        - inter_table_inconsistency
    Use prompts.error_types (or the CLI flag --error-types) to run
    only a subset; the default subset below enables the 4 single-
    column-friendly types. Per-chunk, per-type results are merged,
    clustered (Phase A), optionally synthesised (Phase B), and written
    to outputs/ as JSONL, Markdown, and an interactive HTML dashboard.

data:
  # Paths are relative to the project root. Data is intentionally not shipped;
  # pass --csv/--csv-dir or configure one of these local paths.
  csv_path: null
  # Multi-CSV mode: if csv_dir is set (or --csv points at a directory, or
  # --csv-dir is passed), every file matching csv_glob inside it is loaded
  # and processed in a single run. Findings are tagged with their source
  # filename and clusters never cross CSV boundaries. Leave null to use
  # csv_path. Example:
  #   csv_dir: data/curated
  #   csv_glob: "*.csv"
  csv_dir: null
  csv_glob: "*.csv"
  # 0 means "start at the first data row".
  start_row: 0
  # Number of CSV rows fed to the model per LLM call (a.k.a. "row chunk
  # size"). With column_mode=single this is the only knob you typically
  # need - keep it large so the model sees the entire column distribution
  # in one call. Default 100 = the entire sample_100 in one row chunk.
  chunk_size: 100
  # 'all'   = each LLM call sees every CSV column for the row slice.
  #           REQUIRED for the cross-column / cross-row types:
  #             fd_violation, row_calculation_inconsistency,
  #             string_calculation_inconsistency, row_duplication,
  #             and the Multi-Table type inter_table_inconsistency.
  # 'single'= each LLM call sees one column at a time. Use this ONLY when
  #           every selected error type is single-column-friendly, i.e.
  #           a subset of:
  #             typo, inconsistency, semantic_incompatible,
  #             numeric_outlier.
  # Total detection LLM calls = chunks_per_row * (1 if all else len(columns))
  #                              * len(error_types).
  column_mode: single
  # Optional explicit subset of CSV column names to analyse. null/empty
  # => every column. Useful with column_mode=single to focus on a few
  # columns of interest, e.g. ["Place name", "Status", "Unit"].
  columns: null
  # Cap on the number of chunks analysed (counts (row-slice, column)
  # pairs in single-column mode). Use null for "all chunks". With the
  # 100-row sample (33 columns), chunk_size=100, column_mode=single and
  # the default 4 single-column error types, null => 1 * 33 * 4 = 132
  # detection calls (plus any Phase-B synthesis).
  max_chunks: null
  # When true, prepend a compact whole-table TABLE OVERVIEW block to
  # every per-type detection prompt. The block carries per-column
  # dtype / cardinality / top-values, candidate identity columns,
  # candidate functional dependencies (A -> B), and detected
  # total/summary row indices. Built once per CSV - O(columns) tokens,
  # not O(rows) - so it stays affordable on tall tables.
  #
  # Mostly useful for the multi-column / multi-row error types
  # (fd_violation, row_calculation_inconsistency,
  # string_calculation_inconsistency, row_duplication,
  # inter_table_inconsistency) which need global context the row
  # chunk alone cannot provide. Single-column types ignore it.
  # CLI override: `--no-table-digest` to disable.
  include_table_digest: true

llm:
  # Default detection target. A single model name sends every call
  # to that model; a comma-separated list (or omitting the field)
  # rotates calls across the GPT-5 family WITHIN ONE RUN, spreading
  # load across each model's deployment so the experiment isn't
  # bottlenecked on a single quota. The family list lives in
  # src/core/llm_client.py (GPT5_FAMILY).
  model: gpt-5.2,gpt-5.4,gpt-5.5
  reasoning_effort: medium
  reasoning_summary: detailed
  # Max in-flight LLM calls for per-type detection. null => min(8,
  # #endpoints in llm_client.py).
  concurrency: null

  # ---- Phase-B cluster synthesis ----
  # After per-type detection, overlapping detections on the same row are
  # merged into clusters (Phase A, deterministic). For every multi-type
  # cluster we then fire one extra LLM call that picks a primary error
  # type, emits a canonical explanation + fix, a confidence score, and an
  # "is_likely_false_positive" flag. Disable for a free, deterministic-only
  # run (clusters still materialise, just without canonical fields).
  enable_synthesis: true
  # When true (default) the Phase-B synthesis call also fires for
  # single-detection clusters so the LLM produces a clean canonical fix
  # for every flagged cell, not only multi-type ones. Switch off to
  # restore the original cheaper behaviour (multi-type clusters only).
  synthesise_singletons: true
  # Reasoning effort for the synthesis call. Defaults to `reasoning_effort`.
  synthesis_effort: medium

prompts:
  # Taxonomy definition. The 9 fine-grained error types from
  # error_type.csv live in prompts/error_types.yaml. There is only one
  # taxonomy file in the repo; override the path on the CLI with
  # --error-types-file if you want to experiment with a fork.
  error_types_file: prompts/error_types.yaml
  # Phase-B synthesis prompt (shared system + user template).
  synthesis_prompt_file: prompts/synthesise_cluster.yaml
  # Scope filter: keep only error types whose `category` starts with one
  # of these scope prefixes. Recognised scopes (drawn from the categories
  # in prompts/error_types.yaml):
  #   - single-column   (typo, inconsistency, semantic_incompatible,
  #                      numeric_outlier)
  #   - multi-column    (fd_violation, row_calculation_inconsistency,
  #                      string_calculation_inconsistency)
  #   - multi-row       (row_duplication)
  #   - multi-table     (inter_table_inconsistency)
  # Combine freely: `[single-column, multi-column]`. Use `null`, an empty
  # list, or `[all]` to disable filtering. Applied AFTER `error_types`
  # subset selection. CLI override: `--scopes single-column,multi-column`.
  #
  # NOTE: every scope other than `single-column` requires
  # `data.column_mode: all` so the LLM sees enough context.
  scopes: [single-column]
  # Optional subset of error_type keys to run. null / empty => run all
  # types in the loaded taxonomy.
  #
  # Available keys, grouped by Scope:
  #   Single-Column-friendly (work in column_mode=single):
  #     - typo
  #     - inconsistency  (umbrella; sub-patterns text / casing /
  #                       pattern / punctuation / number_format)
  #     - semantic_incompatible
  #     - numeric_outlier
  #   Require column_mode=all:
  #     - fd_violation
  #     - row_calculation_inconsistency
  #     - string_calculation_inconsistency
  #     - row_duplication
  #   Multi-Table (rare findings; require column_mode=all):
  #     - inter_table_inconsistency
  #
  # Examples:
  #   error_types: [typo, inconsistency]
  #   error_types: [semantic_incompatible, numeric_outlier]
  # Same thing from the CLI (comma-separated, no spaces):
  #   --error-types typo,inconsistency
  # Also: `python -m experiments.run_cleaning_detection --list-error-types`
  # prints every key in the currently-selected taxonomy.
  #
  # Default null = all 9 keys; combine with `single_column_only: true`
  # above to get exactly the 4 Single-Column types.
  error_types: null

# Knobs specific to the row_duplication detector. Only consulted when
# `row_duplication` is among the selected error_types.
#
# `collision_adjudication` is the default and recommended strategy:
#   1. Deterministic scan of the whole table for collision groups (rows
#      that match on a candidate identity key, with optional per-type
#      normalisation: case-fold strings, strip punctuation, coerce
#      numbers, parse dates).
#   2. Optional LLM adjudication of each group asking "are these rows
#      duplicates? exact / near / distinct?". One LLM call per group;
#      group sizes are typically 2-5 rows so each call is tiny and
#      independent of table size.
#   3. Findings emitted in the same JSON shape as the per-chunk scan,
#      so the adaptive estimator and reporting layers are unchanged.
#
# `legacy_chunk_scan` falls back to the original behaviour (one LLM call
# per row chunk asking the LLM to find duplicates inside the chunk).
# This misses any duplicate pair that straddles a chunk boundary on
# tables larger than `chunk_size` rows; kept only for A/B comparison.
row_duplication:
  detection_mode: collision_adjudication  # collision_adjudication | legacy_chunk_scan | whole_table
  # whole_table is a PoC mode that skips ALL clustering and hands the
  # full CSV to one LLM call per source under the same Chao1/GT
  # adaptive stop rule. Sources with more than `whole_table_max_rows`
  # rows are skipped. Use only on small tables.
  whole_table_max_rows: 200
  # Identity-key search: how many candidate key subsets to consider,
  # and how wide they may be. Single-column keys cover most real
  # cases; pair keys catch composite identifiers like
  # (Order_ID, Line_Item).
  max_key_subsets: 4
  max_key_size: 2
  min_dup_rate: 0.0          # Skip subsets whose dup_rate is below this.
  # Cap total adjudicator LLM calls per source. Collision groups are
  # ranked by group size (largest first) and capped here. Set to a
  # large number to disable the cap.
  max_groups_per_source: 200
  # When true, a normalisation pass (lower-case, strip punctuation,
  # coerce numerics) is applied before the duplicate scan. Catches
  # near-duplicates like "Acme Corp." vs "ACME CORPORATION".
  normalize_keys: true
  # When false, deterministic collision groups are emitted as candidates
  # straight away with no LLM verification. Set true (default) to have
  # the LLM confirm each group.
  adjudicate_groups: true
  # Per-column LLM canonicalisation pass. When true, before the
  # collision scan we ask the LLM to bucket equivalent surface forms
  # within each candidate key column ("US" / "USA" / "United States"
  # -> one canonical form). The resulting value->canonical map is fed
  # into the collision scan so semantic duplicates collide
  # deterministically. Adds ~1 LLM call per (source, key column);
  # On by default: combined with normalisation + adjudication, this
  # gives the highest recall path (catches semantic equivalents like
  # "US" / "USA" / "United States" that lexical normalisation alone
  # would miss). Set to false only if the extra LLM call per key
  # column is too expensive for your budget.
  canonicalize_keys: true
  # Skip canonicalisation for columns whose distinct non-null
  # cardinality exceeds this cap (the prompt would be too long for
  # one reliable LLM call).
  canonicalize_max_cardinality: 200
  # Path to the canonicalisation prompt template. Relative paths are
  # resolved against the project root.
  canonicalize_prompt_path: prompts/canonicalize_values.yaml
  # ---- Token-signature blocking (recall-first candidate generator).
  # On by default. Surfaces rows that share a "signature" (first
  # token of each candidate-key column) so abbreviations like
  # "Acme Corp" / "Acme Corporation" land in the same block even
  # when no key matches exactly. Free; runs alongside key-collision.
  blocking_enabled: true
  blocking_signature: first_token  # or 'first_char'
  blocking_min_block_size: 2
  blocking_max_block_size: 50
  # ---- MinHash LSH near-duplicate clusterer. On by default.
  # Catches row-level Jaccard near-duplicates (paraphrased prose,
  # punctuation variations, partial ordering changes). Requires
  # ``datasketch`` to be installed (listed in requirements.txt).
  minhash_enabled: true
  minhash_threshold: 0.7
  minhash_num_perm: 128
  minhash_shingle_size: 1   # 1 for short rows, 2 for prose-like text
  minhash_min_tokens: 3
  minhash_max_cluster_size: 50
  # ---- Sentence-embedding near-duplicate clusterer. On by default.
  # Catches semantic / paraphrase near-duplicates that token-level
  # methods miss ("Acme is the leading vendor" vs "The leading
  # vendor is Acme"). Requires ``sentence-transformers`` to be
  # installed (listed in requirements.txt); on first run downloads
  # the model (~80MB for the default MiniLM). Set ``embedding_model``
  # to ``sentence-transformers/all-mpnet-base-v2`` for higher quality
  # at ~3x the cost.
  embedding_enabled: true
  embedding_threshold: 0.85
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  embedding_min_chars: 8
  embedding_max_cluster_size: 50
  # ---- Adaptive inner loop
  # Whenever ``adjudicate_groups`` or ``canonicalize_keys`` is on,
  # the LLM call is driven through the SAME stop rule used by the
  # experiment-mode adaptive loop -- there is one place to control
  # all LLM-call FN behaviour. The k_max, k_min, epsilon,
  # epsilon_chao1, stop_when ("gt"|"chao1"|"both") and
  # require_two_consecutive knobs all live in
  # ``good_turing.per_arm.defaults`` below and apply uniformly. With
  # ``k_max == 1`` the loop runs exactly once (single-shot).
  # The recall-first union of issues / equivalence classes is
  # returned across runs.

# Inter-column detection pipeline (discover -> verify -> filter -> detect).
# Applied to every "multi-column" / "multi-row" / "multi-table" error type
# in the taxonomy (i.e. any type that requires `column_mode: all`):
#   fd_violation, row_calculation_inconsistency,
#   string_calculation_inconsistency, row_duplication,
#   inter_table_inconsistency.
#
# The pipeline runs four stages per (source, error_type):
#
#   1. DISCOVER candidate relations from the table digest + a row sample.
#      Uses the adaptive Good-Turing / Chao1 stop rule from
#      `good_turing.per_arm.defaults` so passes stop once the missing
#      mass on undiscovered species shrinks below the threshold.
#
#   2. VERIFY each relation by CODE only. The LLM writes a `check(df)`
#      predicate and the sandbox runs it against the full frame to get
#      an empirical pass-rate. When the LLM refuses to write code
#      (free-text rule, world-knowledge dependency, etc.) the relation
#      is marked `verifiable=false` and carries no pass-rate signal;
#      when the sandbox errors while running the code, the verification
#      records the error. Both cases skip the FILTER gate and fall
#      through to the LLM table-scan in DETECT (recall fallback).
#
#   3. FILTER on the code verification record. Recall-focused: only
#      drop rules that are *certainly* not useful. Two bounds on the
#      pass-rate signal:
#        * pass_rate < min_pass_rate   -> "false rule" (majority violate)
#        * pass_rate >= max_pass_rate  -> "no error to detect" (rule holds)
#      A relation that survives is expected to fire on at least one row
#      but not on most rows -- exactly the band where real defects hide.
#      The absolute-count cap `max_violations_per_rule` is disabled by
#      default; pass-rate alone owns the decision regardless of table
#      size. Rules without a pass-rate (code-refused or code-errored)
#      bypass this gate and go straight to DETECT.
#
#   4. DETECT violating rows on surviving rules. Code-verified rules
#      re-run their `check(df)` and emit one finding per False row
#      (`src.core.relation_violations.compile_code_violations`).
#      Code-refused and code-errored rules go through a whole-table
#      LLM scan
#      (`src.core.relation_llm_detector.detect_violations_for_relations`)
#      which enumerates violating rows with a per-row rationale.
#
# Disable the pipeline (`enabled: false`) to fall back to the per-chunk
# `PerTypeCleaningDetector` for inter-column types -- useful for A/B
# comparison or when you only want the single-column path to run.
inter_column_pipeline:
  # Master switch. When true, every inter-column error type is routed
  # through this pipeline; the per-chunk detector still owns the four
  # single-column types (typo, inconsistency, semantic_incompatible,
  # numeric_outlier).
  enabled: true
  # Filter bounds (apply to code-verified rules only -- code-refused /
  # code-errored rules bypass the gate and go straight to the LLM
  # table-scan). The gate is recall-focused: it only drops rules that
  # are *certainly* not useful, leaving everything else for the
  # labeller to triage.
  # Lower bound: a real inter-column rule (especially a functional
  # dependency) holds for essentially every row -- the few rows that
  # violate it are the actual errors. A rule violated by a meaningful
  # fraction of rows is not a real rule, and its "violations" are
  # legitimate variation (false positives). 0.90 = only compile rules
  # that already hold on >=90% of rows. Lower toward 0.5 to keep weaker
  # / approximate rules (high recall, very low precision); raise toward
  # 0.99 to flag only near-perfect rules.
  min_pass_rate: 0.90
  # Upper bound: drop "fully satisfied" rules where the relation holds
  # for every row -- there is no error to detect. Use `1.0` to keep
  # pass_rate=1.0 rules (no-op but cheap); the default trims them.
  max_pass_rate: 0.9999999990  # 1.0 - 1e-9
  # Confidence floor (drops `low`-confidence discovered rules before
  # they reach detection). high|medium|low.
  min_confidence: medium
  # Optional absolute cap on rows compiled per rule. `null` (the
  # default) disables the cap so the pass-rate band above owns the
  # decision uniformly across small and large tables -- a real rule
  # on a 100k-row table can legitimately flag thousands of rows.
  # Set to a positive integer (e.g. 200) only to bound the cluster
  # queue against a single very wrong rule.
  max_violations_per_rule: null
  # Whole-table LLM-scan caps (consulted on every relation that falls
  # through to the LLM detector, i.e. code-refused and code-errored
  # rules). Detection scans the FULL table, so the row cap protects
  # against context-window overflow on tall tables.
  llm_detection_max_rows_per_call: 300
  llm_detection_max_violations_per_rule: 50

good_turing:
  # Settings consumed when `experiment.mode=adaptive` (or `--mode adaptive`
  # on the CLI). Ignored entirely in single mode.
  #
  # Up to K passes over the same data, each with a small perturbation so
  # the detector sees a slightly different view of the world. Detections
  # are canonicalised into (source, column, row) cell species and
  # across runs; Good-Turing and Chao1 then estimate how many more
  # species a hypothetical (K+1)-th run would surface. The final
  # Phase-A clusters / Phase-B synthesis / HTML dashboard are built from
  # the UNION of detections across all completed passes.
  #
  # Perturbation source (pick one or combine):
  #   * prompt_ensemble=true  -> on each pass past the identity baseline,
  #                              an LLM rewrites every selected error
  #                              type's description+notes+example into
  #                              a semantically equivalent but
  #                              linguistically different definition.
  #                              Recommended default: it injects real
  #                              variance into what the detector looks
  #                              for, which makes the GT singletons
  #                              meaningful for cell-local error types.
  #   * shuffle_rows=true     -> permute row order (cheap, but barely
  #                              moves the detector for single-column
  #                              types).
  #   * shuffle_columns=true  -> permute column order (only observable
  #                              in column_mode=all).
  #
  # Every key below is overridable on the CLI via `--gt-...`
  # (e.g. `--gt-mode`, `--gt-num-runs`, `--gt-prompt-ensemble`,
  # `--no-gt-prompt-ensemble`, `--gt-shuffle-rows`, ...).

  # Stopping strategy.
  #   fixed    -> always run exactly `num_runs` passes.
  #   adaptive -> run at least `min_runs`, then stop as soon as the
  #               Good-Turing missing mass estimate drops to or below
  #               `target_missing_mass`. `num_runs` acts as a hard
  #               ceiling so cost is bounded regardless.
  mode: adaptive
  # Maximum number of passes (also the exact count when mode=fixed).
  # Cost scales ~linearly; CIs tighten as runs grow. Typical range 3-10.
  num_runs: 8
  # Adaptive-only: minimum number of runs before we even consider
  # stopping. Prevents stopping on early-sample noise (e.g. run 1
  # trivially has missing mass 0 if every detection is unique).
  min_runs: 3
  # Adaptive-only: stop once the Good-Turing missing mass (the
  # estimated probability that the next run surfaces a never-seen
  # defect) falls to this value or below. 0.05 means "<= 5% new
  # defects expected on the next pass".
  target_missing_mass: 0.05
  # Adaptive-only: granularity at which the stop predicate is
  # evaluated. Each arm = (scope, error_type) is treated as an
  # independent experiment; the loop stops once every error_type's
  # arms have all saturated.
  #   auto        -> pick the natural arm scope for the active
  #                  error-type set: column (single-column-only),
  #                  column_pair (multi-column included), csv
  #                  (multi-row included), multi_table (multi-table
  #                  included). Broadest match wins.
  #   dataset     -> one arm per error_type (pooled across columns and
  #                  sources). Equivalent to the old
  #                  `target_policy: per_type`.
  #   column      -> one arm per (source, column, error_type). Best
  #                  for cell-local types (typo, formatting, ...).
  #   csv         -> one arm per (source, error_type). Pools columns
  #                  but separates files.
  #   column_pair / row / workbook / cross_csv / multi_table -> see
  #     src/adaptive/scoped_gt.py for the full menu.
  stop_scope: auto
  # Seed derivation root. (base_seed, num_runs) -> deterministic
  # perturbation seeds (independent of LLM non-determinism).
  base_seed: 42

  # ---- Prompt-ensemble perturbation ----
  # Ask an LLM to REWRITE each selected error type's description+notes+
  # example on every non-identity pass. The rewriter is told (strongly)
  # to preserve semantic scope (what to flag / what not to flag) and to
  # pick a different rhetorical angle + different illustrative examples.
  # One generator call per (pass, error_type) on top of the detection
  # calls - small relative to detection cost, and cheaper if you set
  # `variant_generation_effort: low`.
  prompt_ensemble: true
  # Rewriter prompt template. Relative paths resolve against project root.
  prompt_variant_template: prompts/generate_prompt_variant.yaml
  # Reasoning effort for the rewriter (independent of the detection
  # effort). `low` is usually fine - the rewrite is a short, structured
  # task.
  variant_generation_effort: low

  # ---- Frame perturbation (row/column order) ----
  # Orthogonal to prompt_ensemble; either, both, or neither can be on.
  # For cell-local types (typo, formatting, etc.) row shuffling barely
  # moves the detector, so prompt_ensemble is the primary perturbation
  # source - row shuffle is off by default.
  shuffle_rows: true
  # Also permute column order per run. Only observable when
  # data.column_mode=all. No-op in column_mode=single.
  shuffle_columns: false
  # If true, every run (including run 0) is perturbed - both the frame
  # (row/col shuffle) and the prompts (variant rewrite). Default (false)
  # keeps run 0 as the un-perturbed baseline so one of the K passes
  # matches what `mode=single` would have produced.
  skip_identity_run: false

  # ---- Scope-aware per-arm Chao1 / Good-Turing ----
  # Each (scope, error_type) pair is an independent experiment; the
  # adaptive loop stops once every active error_type's arms have all
  # saturated at the configured `stop_scope` above. Per-arm artifacts
  # are written to:
  #   good_turing/per_arm_estimates.json
  #   good_turing/per_arm_report.md
  # plus an extra panel inside report.html.
  #
  # The loop-level knobs above feed the per-arm defaults:
  #   * `target_missing_mass` -> default `defaults.epsilon`
  #   * `min_runs`            -> default `defaults.k_min`
  #   * `num_runs`            -> default `defaults.k_max`
  # Setting these explicitly under `per_arm.defaults` overrides the
  # fallbacks for the global default; per-error-type overrides below
  # take final precedence. (There is no `s_min` floor: data-cleaning
  # runs need to allow legitimately rare error types to saturate at
  # very low S_obs.)
  per_arm:
    # Defaults applied to every arm unless overridden in
    # per_error_type. Any field can be omitted to fall through to the
    # corresponding loop-level knob (epsilon / min_runs / num_runs)
    # and finally to ArmConfig.default().
    defaults:
      require_two_consecutive: true  # require two passes meeting the threshold
      # Which estimator(s) gate saturation. Choices:
      #   gt    -> Good-Turing point estimate p_0 <= epsilon (default;
      #            bounds the *probability mass* on undetected species).
      #   chao1 -> Chao1 upper-95 missing-count fraction
      #            (chao1_ci_95_high - S_obs) / S_obs <= epsilon_chao1
      #            (bounds the *count* of undetected species, using the
      #            conservative upper end of the CI).
      #   both  -> require both criteria simultaneously (recommended
      #            for an end-to-end FN guarantee on the dataset).
      stop_when: both
      # Threshold for the Chao1 criterion (only consulted when
      # `stop_when` is `chao1` or `both`). Default 0.05 = "estimated
      # missing count is at most 5% of what we've already observed".
      epsilon_chao1: 0.05
    # Per-error-type overrides (only set the fields you want to change):
    # per_error_type:
    #   typo: {epsilon: 0.02}
    #   numeric_outlier: {k_min: 4, k_max: 20}
    # Whitelist: which error_types are applicable to each scope_kind.
    # Omit to mark every arm applicable.
    # applicability:
    #   column: [typo, inconsistency, semantic_incompatible, numeric_outlier]

output:
  directory: outputs
  # Each run produces a timestamped subdirectory under `output.directory`
  # containing:
  #   chunk_reports.json(l)   - per (chunk, error_type) results
  #                             (slim; no raw LLM text)
  #   issues.json(l)          - raw detections (one per per-type verdict),
  #                             tagged with error_type and enriched with
  #                             source-row values
  #   clusters.json(l)        - Phase-A clusters (+ optional Phase-B
  #                             synthesis). One record per underlying
  #                             defect; this is the default dashboard view.
  #   summary.json            - aggregate counts by error_type,
  #                             taxonomy category, top columns / rows, plus
  #                             cluster-level metrics (multi-type counts,
  #                             primary error type, confidence, likely FPs)
  #   report.md               - human-readable Markdown summary
  #   report.html             - self-contained interactive dashboard with
  #                             a clusters-first dual view ("Clusters" /
  #                             "Raw detections" toggle)
  #   raw_responses/          - raw LLM text + reasoning per call, one file
  #                             per (chunk, error_type) named
  #                             NNNN__<error_type>.txt

logging:
  level: INFO
